# Gateway simulator — opt-in ONLY, never part of the prod stack:
#
#   docker compose -p morghdari -f docker-compose.prod.yml \
#     -f docker-compose.vps.yml -f docker-compose.sim.yml up -d simulator
#
# Publishes schema-2.0 telemetry for the PROVISIONED SIM gateways using the
# credentials minted by the review-approve flow (/opt/morghdari/.sim.env).
# Stop it any time: ... stop simulator / rm simulator. Prod is untouched.

services:
  simulator:
    image: ghcr.io/morghdari/backend:${MORGHDARI_TAG}
    container_name: morghdari-simulator
    mem_limit: 256m
    stop_grace_period: 10s
    command: python /sim/sim.py
    # The backend image bakes a daphne healthcheck (port 8000); the simulator
    # serves nothing, so disable it — otherwise the container shows
    # (unhealthy) forever despite publishing fine.
    healthcheck:
      disable: true
    environment:
      MQTT_HOST: "emqx"
      MQTT_PORT: "8883"
      MQTT_TLS_CA: "/app/certs/ca.crt"
      # Each twin learns its org and farm from the retained config document,
      # exactly as a real device does — so there is no SIM_ORG_UUID to set.
      SIM_INTERVAL_SEC: "60"
      SIM_CREDS_PATH: "/creds.json"
      # Fault injection, all optional and off by default. A clean run proves
      # nothing about error handling, so these exist to be turned on:
      #   SIM_FAULT_DROP=0.05      skip 5% of telemetry windows
      #   SIM_FAULT_DELAY=0.05     delay 5% of sends
      #   SIM_FAULT_DELAY_SEC=10   ...by this many seconds
      #   SIM_FAULT_INVALID=0.02   emit 2% of readings out of physical range
      #   SIM_FAULT_RESTART=0.01   power-cycle 1% of devices per interval
      # SIM_LOG_LEVEL: "DEBUG" 
      DJANGO_SETTINGS_MODULE: "config.settings.production"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS}"
    volumes:
      - ./certs:/app/certs:ro
      # The whole directory, not just sim.py: sim.py imports twin.py, and a
      # single-file mount would leave the import unresolved in the container.
      # It is mounted read-only, so the credentials cannot live inside it —
      # docker cannot create a mountpoint under a read-only bind. Hence the
      # separate /creds.json below, pointed at by SIM_CREDS_PATH.
      - ./simulator:/sim:ro
      - ./.sim.env:/creds.json:ro
      # Where provision.py leaves credentials for newly installed gateways.
      # The fleet reloads this, so a new gateway joins without a restart.
      - sim_state:/sim-state
    depends_on:
      - emqx
      - redis
    restart: "no"

  # One-shot: install N NEW gateways through the real flow and write their
  # credentials into the shared state, where the simulator picks them up.
  #   docker compose ... run --rm provisioner
  #   docker compose ... run --rm -e SIM_PROVISION_COUNT=3 provisioner
  provisioner:
    image: ghcr.io/morghdari/backend:${MORGHDARI_TAG}
    container_name: morghdari-provisioner
    mem_limit: 512m
    command: python /sim/provision.py --count ${SIM_PROVISION_COUNT:-1}
    environment:
      DJANGO_SETTINGS_MODULE: "config.settings.production"
      DATABASE_URL: "postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}"
      DATABASE_ADMIN_URL: "postgres://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/${DATABASE_NAME}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY}"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DEBUG: "False"
      SIM_STATE_DIR: "/sim-state"
    volumes:
      - ./simulator:/sim:ro
      - sim_state:/sim-state
    depends_on:
      - postgres
    restart: "no"

volumes:
  sim_state:

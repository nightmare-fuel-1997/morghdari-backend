# Monitoring rehearsal override (laptop) — mounts a runtime prometheus.yml
# with the EMQX dashboard password substituted at deploy time (the placeholder
# form cannot be interpolated by Prometheus itself — see the deploy-time note
# in monitoring/prometheus.yml). Generated by the rehearsal procedure:
#   sed "s/\${EMQX_DASHBOARD_PASSWORD}/$EMQX_DASHBOARD_PASSWORD/" \
#     monitoring/prometheus.yml > monitoring/prometheus.runtime.yml
# gitignored (contains a credential). VPS day: the guide's `sed -i` on the
# deployed prometheus.yml is the canonical path — omit this override there.

services:
  prometheus:
    volumes:
      - ./prometheus.runtime.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

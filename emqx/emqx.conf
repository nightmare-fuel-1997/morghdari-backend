## ---------------------------------------------------------------------------
## Single source of truth for EMQX (Audit AU-fix 2026-08-16).
## Validate after edits: docker exec morghdari-emqx emqx check config
##
## Mounted read-only at /opt/emqx/etc/emqx.conf by docker-compose.prod.yml (emqx
## service). See also: "MQTT Topic Map & EMQX Config.md" §4.
## Byte-identical port of the docs-repo emqx/emqx.conf.
## ---------------------------------------------------------------------------

node {
  name = "morghdari-emqx@127.0.0.1"
  # Cookie is overridden by the env var EMQX_NODE__COOKIE (injected from the
  # hardened .env — see Deployment & DevOps Guide §3). Never hardcode it here.
  cookie = "${EMQX_NODE__COOKIE}"
  # M7 rehearsal 2026-09-07: the schema REQUIRES node.data_dir when a full
  # custom emqx.conf replaces the packaged default (boot loop found on first
  # real boot — docs-repo canonical copy needs the same line; erratum pending).
  data_dir = "/opt/emqx/data"
}

dashboard {
  listeners {
    http {
      # 0.0.0.0 INSIDE the container is required so the host-side publish
      # ("127.0.0.1:18083:18083") and the Prometheus exporter can reach the
      # API. Exposure is controlled at the HOST boundary: the port is
      # published on loopback only (SSH tunnel access — Deployment Guide §3.1).
      bind = "0.0.0.0:18083"
    }
  }
}

listeners {
  # Plaintext MQTT disabled in production — gateways connect over TLS :8883 only.
  tcp.default {
    enable = false
  }
  ssl.default {
    bind = "0.0.0.0:8883"
    ssl_options {
      certfile = "/opt/emqx/certs/server.crt"
      keyfile = "/opt/emqx/certs/server.key"
      cacertfile = "/opt/emqx/certs/ca.crt"
      # Client certificates are optional in Phase 1 per Security Architecture
      # (username/password bcrypt auth carries the identity); tighten in Phase 2.
      verify = verify_peer
      fail_if_no_peer_cert = false
    }
    max_connections = 10000
    # M7 rehearsal 2026-09-07: the 5.5 limiter schema renamed these keys —
    # re-added below from the live node's schema (docs-repo copy pending the
    # erratum).
  }
}

mqtt {
  max_packet_size = 1MB
  max_clientid_len = 128
  max_topic_levels = 10
  # mqueue sized for ~200 min at 100 gateways / ~40 min at 500 — see DR T4b.
  # Resize with the fleet.
  max_mqueue_len = 20000
  # M7 rehearsal 2026-09-07: the 5.5 name is session_expiry_interval (the old
  # max_session_expiry_interval key is gone — live-schema confirmed).
  session_expiry_interval = 24h
  # Owner decision 2026-10-18 (Tracker §4t): fleet protocol = MQTT 3.1.1 (MQTTv311) —
  # every client pins protocol=MQTTv311 explicitly. This zone setting governs those
  # 3.1.1 persistent sessions exactly as it governs MQTT 5 session-expiry properties.
}

## M7 rehearsal 2026-09-07: the per-listener limiter block moved to this
## TOP-LEVEL root in 5.5 (listener-level keys rejected by the schema).
limiter {
  max_conn_rate = "50/s"
  messages { rate = "20/s" }
  bytes { rate = "100KB/s" }
}

## ${username} below is an EMQX runtime template variable (the connecting
## client's username) — NOT shell or env substitution.
##
## The JOIN enforces the provisioning gate at auth: gateways may connect while
## in a PENDING_* state — their telemetry is buffered in the Redis stream
## telemetry:pending_approval until Farm Manager approval (Reconciliation R3;
## design-zero-touch-provisioning.md §4.3).
authentication = [
  {
    mechanism = password_based
    backend = postgresql
    server = "${DATABASE_HOST}:5432"
    database = "${DATABASE_NAME}"
    # R3-fix 2026-08-16: dedicated emqx_auth role (SELECT on mqtt tables only)
    # — never the Django app role (see Deployment & DevOps Guide §2.2).
    username = "${EMQX_DB_USER}"
    password = "${EMQX_DB_PASSWORD}"
    # M7 rehearsal 2026-09-07: the 5.5 authn:postgresql schema wants the OBJECT
    # form (name only — salt_rounds etc. are still rejected; the bcrypt cost is
    # fixed server-side).
    password_hash_algorithm {
      name = "bcrypt"
    }
    # Phase 1 (2026-10-18, AD-1): a factory-registered unit authenticates
    # BEFORE any gateway_slots row exists, so the JOIN became a LEFT JOIN on
    # device_units too. Two ordinary rows, three conditions — no OR on the
    # credential side, so an unknown username still returns nothing.
    #   bound device      → the original slot-status gate;
    #   unbound factory   → gs IS NULL AND the unit is REGISTERED or BOUND.
    # device_units needs GRANT SELECT for emqx_auth (initdb/01_roles.sql +
    # tenants/0006). It is deliberately NOT RLS'd: it has no org_id.
    query = "SELECT cred.password_hash AS password_hash FROM mqtt_device_credentials cred LEFT JOIN gateway_slots gs ON gs.slot_id = cred.device_id LEFT JOIN device_units du ON du.unit_id = cred.device_id WHERE cred.username = ${username} AND cred.is_active = true AND (gs.provisioning_status IN ('PENDING_INSTALLATION','PENDING_APPROVAL','PROVISIONED') OR (gs.slot_id IS NULL AND du.state IN ('REGISTERED','BOUND')))"
  }
]

## Seed ONLY allow rows — the blanket per-user `#` deny rows are REMOVED;
## deny-by-default comes from no_match = deny. This avoids the ORDER BY
## semantics ambiguity between allow/deny rows for the same client.
authorization {
  sources = [
    {
      type = postgresql
      # M7 rehearsal 2026-09-07: the authz:postgresql query key is `query`
      # (the docs-repo copy says `sql` — booted for the first time here).
      query = "SELECT permission, action, topic FROM mqtt_acl_rules WHERE username = ${username}"
      server = "${DATABASE_HOST}:5432"
      database = "${DATABASE_NAME}"
      # R3-fix 2026-08-16: emqx_auth role (SELECT on mqtt tables only) — not the
      # Django app role.
      username = "${EMQX_DB_USER}"
      password = "${EMQX_DB_PASSWORD}"
      enable = true
    }
  ]
  no_match = deny
  # R3-fix 2026-08-16: `action = deny` is not a valid EMQX 5.x key — the valid
  # pair is no_match + deny_action. `ignore` = leave the client connected but
  # take no action when a rule denies.
  deny_action = ignore
}

## ---------------------------------------------------------------------------
## Dev note: docker-compose.dev.yml deliberately overrides authentication to
## built_in_database (EMQX_AUTHENTICATION__1__BACKEND=built_in_database) and
## sets EMQX_AUTHORIZATION__NO_MATCH=allow. That is dev-only; this file is the
## production configuration.
## ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# FLEET PIN — MQTT 3.1.1 ONLY (hardware-team constraint, owner 2026-10-19).
# Values: 3 = MQTT 3.1, 4 = MQTT 3.1.1, 5 = MQTT 5.0.
# max = 4 REJECTS MQTT 5.0 at CONNECT. Every Morghdari client already pins
# MQTTv311 (publisher, subscriber, firmware_sim, HIL harness); this makes the
# constraint a broker rule instead of an assumption, so a future MQTT-5-only
# client cannot connect and then fail mysteriously at the first 5.0 feature.
# فارسي: پروتکل ۳٫۱٫۱ برای کل اسطول قفل شد؛ اتصال با ۵٫۰ رد می‌شود.
# ---------------------------------------------------------------------------
zone {
  mqtt {
    min_protocol_version = 3
    max_protocol_version = 4
  }
}

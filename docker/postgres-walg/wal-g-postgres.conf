# M8-01 — continuous WAL archiving (DR §2.1 / §3.3; RPO <= 1 h).
# wal-g reads S3/S3-compatible credentials from the environment — injected by
# compose (WALG_S3_PREFIX, AWS_ACCESS_KEY_ID, ...). Never put secrets here.
#
# `postgres -c config_file=` loads this file on top of the stock postgresql.conf.
# The T2 restore drill appends restore_command + recovery_target_time into
# PGDATA/postgresql.auto.conf (always-loaded) — untouched by this image.

# --- connectivity-critical stock settings (MUST repeat here) -----------------
# -c config_file REPLACES PGDATA/postgresql.conf; without these the server
# boots deaf (localhost-only) and hypertables break (no timescaledb preload).
# Values mirror the stock 2.29.2-pg16 effective settings (verified live).
listen_addresses = '*'
port = 5432
shared_preload_libraries = 'timescaledb'

# --- continuous archiving ------------------------------------------------------
archive_mode = on
archive_command = '/usr/local/bin/wal-g wal-push %p 2>> /var/log/wal-g/wal-push.log'
archive_timeout = 300

# Morghdari Redis — canonical production config (Audit AU-fix 2026-08-16).
# Mounted read-only at /usr/local/etc/redis/redis.conf by docker-compose.prod.yml.
# Byte-identical port of the docs-repo redis/redis.conf (Deployment Guide §6).
#
# NOTE: requirepass is passed on the COMMAND LINE
#   (redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD})
# and is intentionally NEVER written to a file.
#
# NOTE: with maxmemory-policy noeviction you MUST trim streams
# (see Saas.md ingestion docs) — Redis rejects writes once maxmemory is hit.

# AOF persistence — fsync on EVERY write (RPO ~ 0; Audit F2 decision 2026-06-28)
appendonly yes
appendfsync always
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (fallback)
save 900 1
save 300 10
save 60 10000

# Security — dangerous commands disabled (requirepass: command line only)
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Memory — hard ceiling below the 2g container mem_limit (docker-compose.prod.yml)
maxmemory 1500mb
maxmemory-policy noeviction

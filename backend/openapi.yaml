                reason: { type: string }
      responses:
        '200':
          description: Unit registered (or already active → idempotent); audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Slot not found in the session org
        '409':
          description: Slot already has different live hardware

  /platform/support/hardware/actuators/{hw_id}/retire/:
    post:
      tags: [Platform Support]
      summary: Retire an actuator hardware unit (v0.9 H2)
      description: >
        Closes the actuator registry row; idempotent on an already-retired row.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: hw_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:

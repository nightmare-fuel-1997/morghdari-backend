                event_type: { type: string, enum: [visitor_entry, vehicle_entry, disinfection, rodent_control, outbreak_prep, other] }
                occurred_at: { type: string, format: date-time }
                person_count: { type: integer }
                details: { type: object, additionalProperties: true, description: "e.g. {origin, purpose, product_used}" }
      responses:
        '201': { description: Event recorded }
        '403': { description: Caller has no role in this org }
    get:
      tags: [Biosecurity]
      summary: List biosecurity events for a farm (v1.4)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farm_id, in: path, required: true, schema: { type: integer } }
        - { name: event_type, in: query, required: false, schema: { type: string } }

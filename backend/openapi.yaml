  # ------------------------------------------------------------------
  # v1.7.0 — Ops wave (M6-10; spec docs/api-ops-v1.md, Tracker §4p).
  # Additive-only; rows follow the REAL frozen schema (spec O2/O3 sketch
  # erratum: lifecycle_threshold_rules has no enabled/updated_at columns).
  # Every list endpoint uses the v1.7.0 pagination convention
  # (limit/offset → {results, count}; spec §1).
  # ------------------------------------------------------------------
  /audit-logs/:
    get:
      tags: [Ops]
      summary: Filterable audit-log query (owner/manager)
      description: >
        Reads account_activity_logs (write-only elsewhere). Filters:
        actor_id, action, farm_id, saloon_id, from/to (ISO Z). Bad scalars →
        400 {"error":"invalid pagination"}. Never cross-org data.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: actor_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: farm_id, in: query, schema: { type: integer } }
        - { name: saloon_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paginated audit rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        actor_id: { type: integer }
                        username: { type: string }
                        action: { type: string }
                        details: {}
                        created_at: { type: string }
        '400': { description: Bad pagination or scalar }
        '403': { description: Forbidden — worker/engineer/doctor }
  /thresholds/:
    get:
      tags: [Ops]
      summary: Threshold rules (engineer+)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: saloon_id, in: query, schema: { type: integer } }
        - { name: metric_key, in: query, schema: { type: string } }
      responses:
        '200':
          description: Rules of own-org templates + the global catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        metric_key: { type: string }
                        template: { type: integer, nullable: true }
                        day_from: { type: integer }
                        day_to: { type: integer }
                        min: { type: number, nullable: true }
                        max: { type: number, nullable: true }
        '403': { description: Forbidden }

  /thresholds/{rule_id}/:
    put:
      tags: [Ops]
      summary: Update a threshold rule (manager+)
      description: >
        Write scope = OWN-org templates ONLY (global catalog rows are
        readable via O2, writable by no one — cross-tenant write hazard).
        Values validated against metric sanity bounds; 400 on absurd values.
        Writes an account_activity_logs row (THRESHOLD_UPDATED).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                min: { type: number }
                max: { type: number }
      responses:
        '200': { description: Updated rule }
        '400': { description: Threshold out of range }
        '403': { description: Forbidden — engineer/worker }
        '404': { description: Unknown or foreign rule (identical) }

  /threshold-templates/:
    get:
      tags: [Ops]
      summary: Threshold template catalog (engineer+)
      description: >
        The caller's catalog — the org's own rows PLUS the org-NULL built-in
        catalog. A foreign org's template is invisible here (and 404s on
        O13–O15), never a cross-tenant leak. `status` filters DRAFT vs
        PUBLISHED (v1.7.1): only PUBLISHED arms alarms, so a client that wants
        "what is live" must say status=PUBLISHED.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: breed_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PUBLISHED] } }
      responses:
        '200':
          description: Catalog rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThresholdTemplate'
        '403': { description: Forbidden }
    post:
      tags: [Ops]
      summary: Author a threshold-template DRAFT (engineer+, farm-scoped)
      description: >
        Creates a DRAFT template with its day-ranged band list. A draft never
        arms a saloon — resolution considers PUBLISHED templates only (O15) — so
        an engineer may author one without touching a live band.

        Scope is fail-closed. owner/manager author anywhere in their org and may
        omit farm_id (an org-wide draft). An ENGINEER must stay inside the farms
        granted via account_role_scopes: a single granted farm may be omitted,
        several in scope require farm_id, and an engineer with NO scope row has
        no template write at all (403).

        Bands are validated: known metric, integer day window in [0, 400],
        numeric min/max inside the O3 sanity bounds, min < max, an nh3 band must
        carry a max (NH3 can never be silenced), and two bands of the same
        metric may not overlap (overlap would make "which max applies" a
        row-order accident).

        Writes a THRESHOLD_TEMPLATE_CREATED audit row (account_activity_logs) in
        the same transaction as the template.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rules]
              properties:
                name: { type: string, maxLength: 100 }
                breed_type: { type: string, maxLength: 50, nullable: true }
                farm_id:
                  type: integer
                  nullable: true
                  description: Owning farm of the draft; omitted = org-wide (owner/manager).
                rules:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    $ref: '#/components/schemas/ThresholdTemplateRuleInput'
      responses:
        '201':
          description: The created DRAFT template with its bands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
        '400': { description: Invalid name/breed_type/rules — unknown metric, bad day range, out-of-range value, unbounded nh3 band, or overlapping bands }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — worker/doctor, or an engineer outside the grant (no scope row = no write) }
        '404': { description: farm_id is not in the caller's org (identical to unknown) }

  /threshold-templates/{template_id}/:
    put:
      tags: [Ops]
      summary: Edit a threshold-template DRAFT (engineer+, farm-scoped)
      description: >
        Partial edit of a DRAFT. `rules`, when present, REPLACES the whole band
        list — the set is the unit of meaning, because bands are validated for
        overlap and a partial band edit could produce a combination no request
        ever contained. Validation is O13's, verbatim.

        A PUBLISHED template is immutable here → 409: its bands are tuned
        through PUT /thresholds/{rule_id}/, which audits each change and
        re-caches immediately. A foreign or org-NULL (built-in) template → 404,
        never an existence oracle. An engineer may only edit drafts of farms in
        the grant (org-wide drafts are org-level business).

        Writes a THRESHOLD_TEMPLATE_UPDATED audit row in the same transaction.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                breed_type: { type: string, maxLength: 50, nullable: true }
                rules:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    $ref: '#/components/schemas/ThresholdTemplateRuleInput'
      responses:
        '200':
          description: The updated DRAFT template with its bands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
        '400': { description: Invalid name/breed_type/rules }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — worker/doctor, or an engineer outside the grant }
        '404': { description: Unknown, foreign, or built-in template (identical) }
        '409': { description: Template is already published (tune its bands through O3)
          }

  /threshold-templates/{template_id}/publish/:
    post:
      tags: [Ops]
      summary: Publish a threshold-template DRAFT (owner, manager)
      description: >
        Makes a draft LIVE: effective_template may resolve it from this moment,
        so the affected saloons are re-cached in the same request (the publish
        fires the alerts cache sweep — the same fast path a rule edit takes).

        Optional `is_default: true` also promotes it to the org's default in the
        same call, demoting the incumbent. 409 when the breed already has a
        published org template, when the default slot is taken, or when the
        template is already published — those uniqueness guards are DB
        constraints, not gentlemen's agreements.

        404 for a foreign or org-NULL (built-in) template: the shared catalog is
        writable by NO ONE, exactly like O3. Writes a
        THRESHOLD_TEMPLATE_PUBLISHED audit row in the same transaction.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_default:
                  type: boolean
                  description: Promote to the org default in the same call.
      responses:
        '200':
          description: The published template with its bands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
        '400': { description: The draft has no rules }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — engineer/doctor/worker }
        '404': { description: Unknown, foreign, or built-in template (identical) }
        '409': { description: Already published, or the breed/default slot is taken }

  /saloons/{saloon_id}/threshold-template/:
    get:
      tags: [Ops]
      summary: A saloon's template assignment and its effective template
      description: >
        `assigned_template_id` is the EXPLICIT assignment (null = inheriting) and
        `source` names the resolution step that actually won: `assigned` |
        `org_breed` | `org_default` | `global_default` | `none`. Readable by any
        member of the owning org; a foreign or unknown saloon is an identical
        404.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Assignment beside the effective resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonTemplateAssignment'
        '401': { description: Missing or invalid token }
        '403': { description: Caller has no org claim }
        '404': { description: Unknown or foreign saloon (identical) }
    put:
      tags: [Ops]
      summary: Assign a threshold template to a saloon (owner, manager)
      description: >
        `{"template_id": 7}` assigns; `{"template_id": null}` CLEARS the
        assignment and returns the saloon to the breed/default chain. The
        template must be own-org and PUBLISHED — a draft cannot be assigned
        (400), and a foreign or org-NULL built-in template is a 404, never an
        existence oracle.

        The saloon is re-cached immediately, so the new bands are armed without
        waiting for the midnight sweep. Writes a SALOON_TEMPLATE_ASSIGNED (or
        SALOON_TEMPLATE_CLEARED) audit row in the same transaction and answers
        the O16 GET shape.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: integer
                  nullable: true
                  description: Published own-org template; null clears the assignment.
      responses:
        '200':
          description: Assignment beside the effective resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonTemplateAssignment'
        '400': { description: Invalid template_id, or the template is not published }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — engineer/doctor/worker }
        '404': { description: Unknown or foreign saloon / template (identical) }

  /saloons/{saloon_id}/photos/:
    get:
      tags: [Ops]
      summary: List saloon photos (any member of the owning org)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Photo rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        url: { type: string }
                        caption: { type: string, nullable: true }
                        taken_at: { type: string, nullable: true }
                        uploaded_by: { type: integer }
        '403': { description: Not a tenant member }
        '404': { description: Unknown or foreign saloon (identical) }
    post:
      tags: [Ops]
      summary: Upload a saloon photo (engineer+)
      description: >
        Multipart file (jpg/png ≤10 MB), optional caption/taken_at. Storage
        backend is a deploy setting (spec §2 O6). Foreign/unknown saloon →
        404 (identical).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                caption: { type: string }
                taken_at: { type: string }
      responses:
        '201': { description: Created photo }
        '400': { description: Type/size violation or missing file }
        '403': { description: Forbidden — worker/doctor }
        '404': { description: Unknown or foreign saloon (identical) }

  /gateways/:
    get:
      tags: [Ops]
      summary: Gateway slots (manager+, read-only)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: farm_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Gateway rows (last_seen_at from the diag register)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        slot_id: { type: string }
                        farm_id: { type: integer, nullable: true }
                        provisioning_status: { type: string }
                        last_seen_at: { type: string, nullable: true }
                        saloon_count: { type: integer }
        '403': { description: Forbidden — engineer/worker/doctor }

  /gateways/{slot}/:
    get:
      tags: [Ops]
      summary: One gateway + saloon zones + active hardware (manager+)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: slot, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Gateway detail }
        '404': { description: Unknown or foreign gateway (identical) }

  /gateways/{slot}/diagnostics/:
    get:
      tags: [Ops]
      summary: Last retained gateway diagnostics (engineer+)
      description: >
        Serves the diag:last:{slot} Redis hash written by the subscriber for
        diagnostics-only self-reports (Firmware §3.8). 404 {"error":"no
        diagnostics yet"} when the gateway never reported (or Redis down —
        honest degradation).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: slot, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Last diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot_id: { type: string }
                  reported_at: { type: string, nullable: true }
                  battery_v: { type: number, nullable: true }
                  rssi: { type: number, nullable: true }
                  free_heap: { type: number, nullable: true }
                  sd_ok: { type: boolean, nullable: true }
                  errors:
                    type: array
                    items: { type: string }
        '404': { description: No diagnostics yet, or unknown/foreign slot (404 either way) }

  /auth/password/change/:
    post:
      tags: [Authentication]
      summary: Change own password (any authenticated user; 3/min auth_strict)
      description: >
        {current_password, new_password} — new ≥10 chars, denylist + Django
        validators. 401 wrong current; 400 weak/new-equals-old; 429 past
        3/min per user. All the caller's refresh lines die (user_sessions
        rows revoked; jti-checked at refresh).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: Password changed }
        '400': { description: Weak or identical new password }
        '401': { description: Wrong current password }
        '429': { description: Past the 3/min auth_strict lane }

  /auth/sessions/:
    get:
      tags: [Authentication]
      summary: List OWN live sessions (any authenticated user)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The caller's session register
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    created_at: { type: string, nullable: true }
                    last_seen_at: { type: string, nullable: true }
                    ip: { type: string, nullable: true }
                    user_agent: { type: string, nullable: true }
                    current: { type: boolean }

  /auth/sessions/{session_id}/:
    delete:
      tags: [Authentication]
      summary: Revoke one of OWN sessions
      description: >
        404 identical for foreign/unknown ids (never an existence oracle);
        revocation kills the refresh line (jti-checked at refresh; access
        token expires within 15 min).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revoked }
        '404': { description: Unknown or foreign session (identical) }

  # ------------------------------------------------------------------
  # v1.7.0 — W1..W5 compat report aliases (M7-17; spec
  # docs/api-reports-merge-v1.md §5, error contract
  # docs/api-compat-flutter-v1.md §3/§8). The reports-only compat-write
  # exception (C-09 stands for everything else). Slugs resolve via
  # legacy_slug_map against the JWT org claim — unknown, foreign or
  # disagreeing slugs are 404 {"error": ...} (never a 400 oracle, never
  # 500); inverted from/to is 400. Reporter is always the JWT user.
  # Full /api/compat/v1 prefix is documented verbatim here (these routes
  # live outside /api/v1/); the legacy /api/... twins hit the same views.
  # ------------------------------------------------------------------
  /api/compat/v1/farms/{farmSlug}/salons/{salonSlug}/reports/:
    get:
      tags: [Compat Reports]
      summary: W1 — compat daily-report list (Flutter calendar/history)
      description: >
        Thin shim over GET /saloons/{saloon_id}/reports/: from/to/status
        semantics preserved verbatim (bare merged list, newest first).
        ?status=incomplete returns DRAFT+SUBMITTED (the Flutter dashboard
        queue); native callers use the v1.5 enum values.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farmSlug, in: path, required: true, schema: { type: string } }
        - { name: salonSlug, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Merged report list (bare array) }
        '400': { description: Inverted or unparseable from/to window }
        '404': { description: Unknown, foreign or disagreeing farm/salon slug }

  /api/compat/v1/farms/{farmSlug}/salons/{salonSlug}/reports/{report_date}/:
    get:
      tags: [Compat Reports]
      summary: W2 — compat single report by calendar day
      description: >
        Thin shim over GET /saloons/{saloon_id}/reports/{report_date}/:
        merged single shape; absent → 404; several flocks sharing the
        saloon+day → 400 multiple reports for date.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farmSlug, in: path, required: true, schema: { type: string } }
        - { name: salonSlug, in: path, required: true, schema: { type: string } }
        - { name: report_date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: The day's report (merged single shape) }
        '400': { description: Bad date, or several reports share the saloon+day }
        '404': { description: Unknown/foreign slug, or no report for the day }

  /api/compat/v1/farms/{farmSlug}/reports/:
    get:
      tags: [Compat Reports]
      summary: W5 — compat farm-level report queue (Flutter dashboard)
      description: >
        Every saloon of the farm in one bare merged list (newest first);
        ?status=incomplete returns DRAFT+SUBMITTED; from/to narrow the
        window. Other farms' reports never leak in.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farmSlug, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Merged report list (bare array) }
        '400': { description: Inverted or unparseable from/to window }
        '404': { description: Unknown or foreign farm slug }

  /api/compat/v1/reports/:
    post:
      tags: [Compat Reports]
      summary: W3 — compat report write (slugs in body, reporter = JWT user)
      description: >
        Thin shim over POST /saloons/{saloon_id}/reports/. Body carries
        farm_slug + salon_slug (both required; must agree — the salon's
        farm == the farm, mismatch is 404, never a 400 oracle) plus every
        §2 canonical/alias field. Aliases, checklist enforcement, FLAGGED
        auto-ticket and reporter=JWT-user ride along; any client-sent
        reporter key is ignored.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_slug, salon_slug, flock_id, report_date]
              properties:
                farm_slug: { type: string }
                salon_slug: { type: string }
                flock_id: { type: integer }
                report_date: { type: string, format: date }
                mortality_count: { type: integer, minimum: 0 }
                casualties_today: { type: integer, minimum: 0, description: Input alias of mortality_count }
                feed_kg: { type: number }
                feed_consumed_kg: { type: number, description: Input alias of feed_kg }
                water_l: { type: number }
                water_consumed_l: { type: number, description: Input alias of water_l }
                avg_weight_g: { type: number }
                avg_sample_weight_g: { type: number, description: Input alias of avg_weight_g }
                status: { type: string, enum: [DRAFT, SUBMITTED] }
                is_draft: { type: boolean }
                bird_count: { type: integer, minimum: 0 }
                avg_temperature_c: { type: number }
                avg_humidity_pct: { type: number, minimum: 0, maximum: 100 }
                ventilation_status: { type: string, enum: [STABLE, NEEDS_REVIEW, PROBLEM] }
                health_status: { type: string, enum: [NORMAL, WARNING, CRITICAL] }
                checklist:
                  type: object
                  properties:
                    feed: { type: boolean }
                    water: { type: boolean }
                    device: { type: boolean }
                notes: { type: string }
                medications:
                  type: array
                  items:
                    type: object
                    properties:
                      catalog_item_id: { type: integer, nullable: true }
                      medication_name: { type: string }
                      dosage: { type: string }
                      frequency: { type: string }
      responses:
        '201': { description: Report created (aliases normalized, reporter = JWT user) }
        '400': { description: Missing slugs, duplicate flock/saloon/date, conflicting aliases, or checklist incomplete }
        '404': { description: Unknown, foreign or disagreeing farm/salon slug }

  /api/compat/v1/reports/{report_id}/:
    patch:
      tags: [Compat Reports]
      summary: W4 — compat report edit (aliases accepted)
      description: >
        Thin shim over PATCH /reports/{report_id}/: same Tehran-day
        time-lock, in-play checklist scoping and staff-exempt audit.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: report_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mortality_count: { type: integer, minimum: 0 }
                casualties_today: { type: integer, minimum: 0, description: Input alias of mortality_count }
                feed_kg: { type: number }
                feed_consumed_kg: { type: number, description: Input alias of feed_kg }
                water_l: { type: number }
                water_consumed_l: { type: number, description: Input alias of water_l }
                avg_weight_g: { type: number }
                avg_sample_weight_g: { type: number, description: Input alias of avg_weight_g }
                notes: { type: string }
                status: { type: string, enum: [DRAFT, SUBMITTED] }
                is_draft: { type: boolean }
                bird_count: { type: integer, minimum: 0 }
                avg_temperature_c: { type: number }
                avg_humidity_pct: { type: number, minimum: 0, maximum: 100 }
                ventilation_status: { type: string, enum: [STABLE, NEEDS_REVIEW, PROBLEM] }
                health_status: { type: string, enum: [NORMAL, WARNING, CRITICAL] }
                checklist:
                  type: object
                  properties:
                    feed: { type: boolean }
                    water: { type: boolean }
                    device: { type: boolean }
      responses:
        '200': { description: Report updated }
        '400': { description: Conflicting alias fields, or checklist incomplete on SUBMITTED }
        '403': { description: Edit window closed or caller lacks edit rights }
        '404': { description: Report not found }

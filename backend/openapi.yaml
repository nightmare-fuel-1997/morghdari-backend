  /farms/{farm_id}/biosecurity-events/:
    post:
      tags: [Biosecurity]
      summary: Record a biosecurity event (v1.4 — visitor/vehicle/disinfection log)
      description: >
        Requires engineer+ for the farm (any staff role may record; owner/admin
        review). Avian-flu evidence base: who entered, when, what disinfection
        was done. Feeds GS-EVIDENCE export packs (vet inspections, insurance).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farm_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: { type: string, enum: [visitor_entry, vehicle_entry, disinfection, rodent_control, outbreak_prep, other] }
                occurred_at: { type: string, format: date-time }
                person_count: { type: integer }
                details: { type: object, additionalProperties: true, description: "e.g. {origin, purpose, product_used}" }
      responses:
        '201': { description: Event recorded }
        '403': { description: Caller has no role in this org }
    get:
      tags: [Biosecurity]
      summary: List biosecurity events for a farm (v1.4)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farm_id, in: path, required: true, schema: { type: integer } }
        - { name: event_type, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    event_type: { type: string }
                    occurred_at: { type: string, format: date-time }
                    person_count: { type: integer, nullable: true }
                    recorded_by: { type: integer }

  /saloons/{saloon_id}/capabilities/:
    get:
      tags: [System]
      summary: Saloon capability profile (v1.4 — Saas Decision 23)
      description: >
        The capability-modularity contract made real: for every optional feature
        (water, THI, CO, power, FCR, mortality %, compliance %, biosecurity, ...)
        returns available=true, or available=false with the missing inputs and an
        enable path. Computed from active sensor slots' allowed_metric_keys, keys
        seen in telemetry, and manual-log availability — nothing is configured.
        Threshold rules only evaluate for metrics with live sources (D23).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Capability profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  saloon_id: { type: integer }
                  live_metrics: { type: array, items: { type: string } }
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        feature: { type: string, example: fcr }
                        available: { type: boolean }
                        missing_inputs: { type: array, items: { type: string } }
                        enable_path: { type: string, example: "Log a weight sample or connect a weigh station" }

  /org/members/:
    get:
      tags: [Organization]
      summary: List members of the caller's org (v1.4.3)
      description: >
        RLS scopes the result automatically — the middleware GUC restricts every
        row to the caller's own org (Security §4.1), so no org parameter exists
        or is needed.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Org members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgMemberOut'
        '401': { description: Invalid or missing token }
    post:
      tags: [Organization]
      summary: Invite a member — create or reactivate (v1.4.3)
      description: >
        Owner-exclusive write (403 otherwise). If the username does not exist,
        the user is created with an UNUSABLE password plus an ACTIVE org_members
        row (201). If an INACTIVE org_members row already exists for that
        (org_id, user_id) pair it is REACTIVATED and 200 is returned; if an
        ACTIVE membership exists, 409 Conflict. UNIQUE(org_id, user_id) stands —
        no schema change.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgMemberInviteRequest'
      responses:
        '201':
          description: Member created (user + active org_members row)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberOut'
        '200':
          description: Existing INACTIVE membership reactivated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberOut'
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not the org owner }
        '409':
          description: |
            An ACTIVE org_members row for this (org_id, user_id) already exists.

  /org/members/{member_id}/deactivate/:
    post:
      tags: [Organization]
      summary: Deactivate a member — soft-off, never delete (v1.4.3)
      description: >
        Owner-exclusive write. Sets org_members.is_active = false; the row is
        NEVER deleted. A deactivated member's live access tokens die naturally
        within ≤15 min; their next refresh returns a token WITHOUT an org_id
        claim ⇒ no GUC ⇒ tenant reads return HTTP 200 with empty payloads
        (fail-closed — Security §4.1, constraint C-14).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: member_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Membership deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_active: { type: boolean, example: false }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not the org owner }
        '404': { description: No such member in the caller's org }

  /org/members/{member_id}/:
    patch:
      tags: [Organization]
      summary: Change a member's role — owner only (v1.7.2)
      description: >
        Owner-exclusive role change. Before this endpoint the only way a
        membership changed role was deactivate + re-invite, and the `reviewer`
        role the v1.5 reports wave defined could not be granted at all. The role
        enum is the org-role list INCLUDING reviewer; a foreign member id is the
        same 404 as an unknown one (never an existence oracle).

        Role claims are minted from the membership row at login/refresh, so the
        change lands on a fresh token: this endpoint revokes the member's live
        refresh lines in the same transaction (their access token keeps the old
        role for ≤15 min — the accepted C-14 shape). Deliberately refused: a
        SELF-change (an owner demoting themselves would lock the org out of every
        owner-only surface with nothing able to undo it) and a no-op change. A
        MEMBER_ROLE_CHANGED audit row is always written.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: member_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [owner, manager, engineer, doctor, worker, installer, reviewer]
      responses:
        '200':
          description: Membership updated (the OrgMemberOut row)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgMemberOut'
        '400': { description: Unknown role }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not the org owner }
        '404': { description: No such member in the caller's org }
        '409':
          description: |
            A state precondition failed — the member already has this role, or
            the caller tried to change their OWN role.

  /saloons/{saloon_id}/reports/:
    get:
      tags: [Daily Reports]
      summary: List daily reports for a saloon (v1.5 — Tracker §4n; merged keys v1.7.0 — Tracker §4s)
      description: >
        Reviewer role is READ-ONLY org-wide here (no approve/reject).
        RLS scopes rows to the caller's org (Security §4.1). v1.7.0 merge:
        every item appends the §4s extras keys (bird_count,
        avg_temperature_c, avg_humidity_pct, ventilation_status,
        health_status, checklist{feed,water,device}) plus is_completed
        (true when APPROVED) — bare list, no envelope.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [DRAFT, SUBMITTED, FLAGGED, APPROVED, REJECTED] } }
      responses:
        '200':
          description: Daily reports (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    report_date: { type: string, format: date }
                    mortality_count: { type: integer }
                    feed_kg: { type: number, nullable: true }
                    water_l: { type: number, nullable: true }
                    avg_weight_g: { type: number, nullable: true }
                    status: { type: string }
                    bird_count: { type: integer, nullable: true }
                    avg_temperature_c: { type: number, nullable: true }
                    avg_humidity_pct: { type: number, nullable: true }
                    ventilation_status: { type: string, nullable: true }
                    health_status: { type: string, nullable: true }
                    checklist:
                      type: object
                      properties:
                        feed: { type: boolean }
                        water: { type: boolean }
                        device: { type: boolean }
                    is_completed: { type: boolean }
        '403': { description: Forbidden — user not in the target org }
    post:
      tags: [Daily Reports]
      summary: Submit a daily report (v1.5 — Tracker §4n; merged inputs v1.7.0 — Tracker §4s)
      description: >
        Requires engineer+ role for the saloon. ONE row per (flock, saloon,
        report_date). Report WITH medication lines → status FLAGGED + auto
        support_tickets row (category=medical, assigned to first active
        doctor) + WS push to doctor. v1.7.0 merge: Flutter names are
        input-only aliases (casualties_today→mortality_count,
        feed_consumed_kg→feed_kg, water_consumed_l→water_l,
        avg_sample_weight_g→avg_weight_g, is_draft→status, Persian
        ventilation/health literals→English enums); both-names-sent with
        different values → 400 conflicting fields; new extras fields
        (bird_count, avg_temperature_c, avg_humidity_pct,
        ventilation_status, health_status, checklist) persist to the
        1:1 side table; SUBMITTED with an incomplete checklist → 400.
        farm_slug/salon_slug are NOT accepted here (the path carries the
        saloon) — they exist only on the W3 compat alias.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flock_id, report_date]
              properties:
                flock_id: { type: integer }
                report_date: { type: string, format: date, description: Calendar day in Asia/Tehran }
                mortality_count: { type: integer, minimum: 0 }
                casualties_today: { type: integer, minimum: 0, description: Input alias of mortality_count }
                feed_kg: { type: number }
                feed_consumed_kg: { type: number, description: Input alias of feed_kg }
                water_l: { type: number }
                water_consumed_l: { type: number, description: Input alias of water_l }
                avg_weight_g: { type: number }
                avg_sample_weight_g: { type: number, description: Input alias of avg_weight_g }
                status: { type: string, enum: [DRAFT, SUBMITTED] }
                is_draft: { type: boolean, description: Input alias of status (true→DRAFT, false→SUBMITTED) }
                bird_count: { type: integer, minimum: 0 }
                avg_temperature_c: { type: number }
                avg_humidity_pct: { type: number, minimum: 0, maximum: 100 }
                ventilation_status: { type: string, enum: [STABLE, NEEDS_REVIEW, PROBLEM], description: Persian literals accepted }
                health_status: { type: string, enum: [NORMAL, WARNING, CRITICAL], description: Persian literals accepted }
                checklist:
                  type: object
                  properties:
                    feed: { type: boolean }
                    water: { type: boolean }
                    device: { type: boolean }
                notes: { type: string }
                medications:
                  type: array
                  items:
                    type: object
                    properties:
                      catalog_item_id: { type: integer, nullable: true }
                      medication_name: { type: string }
                      dosage: { type: string }
                      frequency: { type: string }
      responses:
        '201': { description: Report created (DRAFT, or FLAGGED when medications present) }
        '400': { description: Duplicate flock/saloon/date, conflicting alias fields, or checklist incomplete on SUBMITTED }
        '403': { description: Caller lacks the engineer role for this saloon }

  /saloons/{saloon_id}/reports/{report_date}/:
    get:
      tags: [Daily Reports]
      summary: Single daily report by calendar day (v1.7.0 merge — Tracker §4s; the Flutter calendar selection)
      description: >

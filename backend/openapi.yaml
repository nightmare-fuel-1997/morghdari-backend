              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    category: { type: string }
                    title: { type: string }
                    status: { type: string }
                    priority: { type: string }
                    linked_report_id: { type: integer, nullable: true }
                    assigned_to: { type: integer, nullable: true }
        '403': { description: Forbidden — user not in the target org }
    post:
      tags: [Support Tickets]
      summary: Raise a support ticket (v1.5 — Tracker §4n)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, title]
              properties:
                category: { type: string, enum: [medical, support, installer, report] }
                saloon_id: { type: integer, nullable: true }
                linked_report_id: { type: integer, nullable: true }
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
      responses:
        '201': { description: Ticket created (medical tickets route to the on-call doctor) }
        '403': { description: Forbidden — user not in the target org }

  # ------------------------------------------------------------------
  # v1.7.0 — Ops wave (M6-10; spec docs/api-ops-v1.md, Tracker §4p).
  # Additive-only; rows follow the REAL frozen schema (spec O2/O3 sketch
  # erratum: lifecycle_threshold_rules has no enabled/updated_at columns).
  # Every list endpoint uses the v1.7.0 pagination convention
  # (limit/offset → {results, count}; spec §1).
  # ------------------------------------------------------------------
  /audit-logs/:
    get:
      tags: [Ops]
      summary: Filterable audit-log query (owner/manager)
      description: >
        Reads account_activity_logs (write-only elsewhere). Filters:
        actor_id, action, farm_id, saloon_id, from/to (ISO Z). Bad scalars →
        400 {"error":"invalid pagination"}. Never cross-org data.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: actor_id, in: query, schema: { type: integer } }
        - { name: action, in: query, schema: { type: string } }
        - { name: farm_id, in: query, schema: { type: integer } }
        - { name: saloon_id, in: query, schema: { type: integer } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Paginated audit rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        actor_id: { type: integer }
                        username: { type: string }
                        action: { type: string }
                        details: {}
                        created_at: { type: string }
        '400': { description: Bad pagination or scalar }
        '403': { description: Forbidden — worker/engineer/doctor }
  /thresholds/:
    get:
      tags: [Ops]
      summary: Threshold rules (engineer+)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: saloon_id, in: query, schema: { type: integer } }
        - { name: metric_key, in: query, schema: { type: string } }
      responses:
        '200':
          description: Rules of own-org templates + the global catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        metric_key: { type: string }
                        template: { type: integer, nullable: true }
                        day_from: { type: integer }
                        day_to: { type: integer }
                        min: { type: number, nullable: true }
                        max: { type: number, nullable: true }
        '403': { description: Forbidden }

  /thresholds/{rule_id}/:
    put:
      tags: [Ops]
      summary: Update a threshold rule (manager+)
      description: >
        Write scope = OWN-org templates ONLY (global catalog rows are
        readable via O2, writable by no one — cross-tenant write hazard).
        Values validated against metric sanity bounds; 400 on absurd values.
        Writes an account_activity_logs row (THRESHOLD_UPDATED).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: rule_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                min: { type: number }
                max: { type: number }
      responses:
        '200': { description: Updated rule }
        '400': { description: Threshold out of range }
        '403': { description: Forbidden — engineer/worker }
        '404': { description: Unknown or foreign rule (identical) }

  /threshold-templates/:
    get:
      tags: [Ops]
      summary: Threshold template catalog (engineer+)
      description: >
        The caller's catalog — the org's own rows PLUS the org-NULL built-in
        catalog. A foreign org's template is invisible here (and 404s on
        O13–O15), never a cross-tenant leak. `status` filters DRAFT vs
        PUBLISHED (v1.7.1): only PUBLISHED arms alarms, so a client that wants
        "what is live" must say status=PUBLISHED.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: breed_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PUBLISHED] } }
      responses:
        '200':
          description: Catalog rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ThresholdTemplate'
        '403': { description: Forbidden }
    post:
      tags: [Ops]
      summary: Author a threshold-template DRAFT (engineer+, farm-scoped)
      description: >
        Creates a DRAFT template with its day-ranged band list. A draft never
        arms a saloon — resolution considers PUBLISHED templates only (O15) — so
        an engineer may author one without touching a live band.

        Scope is fail-closed. owner/manager author anywhere in their org and may
        omit farm_id (an org-wide draft). An ENGINEER must stay inside the farms
        granted via account_role_scopes: a single granted farm may be omitted,
        several in scope require farm_id, and an engineer with NO scope row has
        no template write at all (403).

        Bands are validated: known metric, integer day window in [0, 400],
        numeric min/max inside the O3 sanity bounds, min < max, an nh3 band must
        carry a max (NH3 can never be silenced), and two bands of the same
        metric may not overlap (overlap would make "which max applies" a
        row-order accident).

        Writes a THRESHOLD_TEMPLATE_CREATED audit row (account_activity_logs) in
        the same transaction as the template.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, rules]
              properties:
                name: { type: string, maxLength: 100 }
                breed_type: { type: string, maxLength: 50, nullable: true }
                farm_id:
                  type: integer
                  nullable: true
                  description: Owning farm of the draft; omitted = org-wide (owner/manager).
                rules:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    $ref: '#/components/schemas/ThresholdTemplateRuleInput'
      responses:
        '201':
          description: The created DRAFT template with its bands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
        '400': { description: Invalid name/breed_type/rules — unknown metric, bad day range, out-of-range value, unbounded nh3 band, or overlapping bands }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — worker/doctor, or an engineer outside the grant (no scope row = no write) }
        '404': { description: farm_id is not in the caller's org (identical to unknown) }

  /threshold-templates/{template_id}/:
    put:
      tags: [Ops]
      summary: Edit a threshold-template DRAFT (engineer+, farm-scoped)
      description: >
        Partial edit of a DRAFT. `rules`, when present, REPLACES the whole band
        list — the set is the unit of meaning, because bands are validated for
        overlap and a partial band edit could produce a combination no request
        ever contained. Validation is O13's, verbatim.

        A PUBLISHED template is immutable here → 409: its bands are tuned
        through PUT /thresholds/{rule_id}/, which audits each change and
        re-caches immediately. A foreign or org-NULL (built-in) template → 404,
        never an existence oracle. An engineer may only edit drafts of farms in
        the grant (org-wide drafts are org-level business).

        Writes a THRESHOLD_TEMPLATE_UPDATED audit row in the same transaction.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                breed_type: { type: string, maxLength: 50, nullable: true }
                rules:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    $ref: '#/components/schemas/ThresholdTemplateRuleInput'
      responses:
        '200':
          description: The updated DRAFT template with its bands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
        '400': { description: Invalid name/breed_type/rules }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — worker/doctor, or an engineer outside the grant }
        '404': { description: Unknown, foreign, or built-in template (identical) }
        '409': { description: Template is already published (tune its bands through O3)
          }

  /threshold-templates/{template_id}/publish/:
    post:
      tags: [Ops]
      summary: Publish a threshold-template DRAFT (owner, manager)
      description: >
        Makes a draft LIVE: effective_template may resolve it from this moment,
        so the affected saloons are re-cached in the same request (the publish
        fires the alerts cache sweep — the same fast path a rule edit takes).

        Optional `is_default: true` also promotes it to the org's default in the
        same call, demoting the incumbent. 409 when the breed already has a
        published org template, when the default slot is taken, or when the
        template is already published — those uniqueness guards are DB
        constraints, not gentlemen's agreements.

        404 for a foreign or org-NULL (built-in) template: the shared catalog is
        writable by NO ONE, exactly like O3. Writes a
        THRESHOLD_TEMPLATE_PUBLISHED audit row in the same transaction.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: template_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_default:
                  type: boolean
                  description: Promote to the org default in the same call.
      responses:
        '200':
          description: The published template with its bands
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
        '400': { description: The draft has no rules }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — engineer/doctor/worker }
        '404': { description: Unknown, foreign, or built-in template (identical) }
        '409': { description: Already published, or the breed/default slot is taken }

  /saloons/{saloon_id}/threshold-template/:
    get:
      tags: [Ops]
      summary: A saloon's template assignment and its effective template
      description: >
        `assigned_template_id` is the EXPLICIT assignment (null = inheriting) and
        `source` names the resolution step that actually won: `assigned` |
        `org_breed` | `org_default` | `global_default` | `none`. Readable by any
        member of the owning org; a foreign or unknown saloon is an identical
        404.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Assignment beside the effective resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonTemplateAssignment'
        '401': { description: Missing or invalid token }
        '403': { description: Caller has no org claim }
        '404': { description: Unknown or foreign saloon (identical) }
    put:
      tags: [Ops]
      summary: Assign a threshold template to a saloon (owner, manager)
      description: >
        `{"template_id": 7}` assigns; `{"template_id": null}` CLEARS the
        assignment and returns the saloon to the breed/default chain. The
        template must be own-org and PUBLISHED — a draft cannot be assigned
        (400), and a foreign or org-NULL built-in template is a 404, never an
        existence oracle.

        The saloon is re-cached immediately, so the new bands are armed without
        waiting for the midnight sweep. Writes a SALOON_TEMPLATE_ASSIGNED (or
        SALOON_TEMPLATE_CLEARED) audit row in the same transaction and answers
        the O16 GET shape.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template_id:
                  type: integer
                  nullable: true
                  description: Published own-org template; null clears the assignment.
      responses:
        '200':
          description: Assignment beside the effective resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonTemplateAssignment'
        '400': { description: Invalid template_id, or the template is not published }
        '401': { description: Missing or invalid token }
        '403': { description: Forbidden — engineer/doctor/worker }
        '404': { description: Unknown or foreign saloon / template (identical) }

  /saloons/{saloon_id}/photos/:
    get:
      tags: [Ops]
      summary: List saloon photos (any member of the owning org)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Photo rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        url: { type: string }
                        caption: { type: string, nullable: true }
                        taken_at: { type: string, nullable: true }
                        uploaded_by: { type: integer }
        '403': { description: Not a tenant member }
        '404': { description: Unknown or foreign saloon (identical) }
    post:
      tags: [Ops]
      summary: Upload a saloon photo (engineer+)
      description: >
        Multipart file (jpg/png ≤10 MB), optional caption/taken_at. Storage
        backend is a deploy setting (spec §2 O6). Foreign/unknown saloon →
        404 (identical).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                caption: { type: string }
                taken_at: { type: string }
      responses:
        '201': { description: Created photo }
        '400': { description: Type/size violation or missing file }
        '403': { description: Forbidden — worker/doctor }
        '404': { description: Unknown or foreign saloon (identical) }

  /gateways/:
    get:
      tags: [Ops]
      summary: Gateway slots (manager+, read-only)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 0, maximum: 500, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: farm_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: Gateway rows (last_seen_at from the diag register)
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        slot_id: { type: string }
                        farm_id: { type: integer, nullable: true }
                        provisioning_status: { type: string }
                        last_seen_at: { type: string, nullable: true }
                        saloon_count: { type: integer }
        '403': { description: Forbidden — engineer/worker/doctor }

  # ------------------------------------------------------------------
  # v1.7.2 — RATIFIED ERRATUM: the four manager-side gateway lifecycle twins
  # shipped in v0.5 and were never documented (the support-side suspend/resume
  # IS documented under /platform/...). They lived in the contract gate's
  # ERRATUM_PENDING set; this ratification empties it, so an undocumented
  # route now fails the gate instead of being tolerated.
  # ------------------------------------------------------------------
  /gateways/{gateway_slot_id}/suspend/:
    post:
      tags: [Provisioning & Gateways]
      summary: Suspend a gateway — manager/owner (v0.5, ratified v1.7.2)
      description: >
        Sets the slot to SUSPENDED and revokes its EMQX ACLs (no_match=deny
        drops every publish until resume). Only a PROVISIONED gateway can be
        suspended — anything else is a 409. Foreign/unknown slot → 404.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: gateway_slot_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: Planned panel maintenance }
      responses:
        '200':
          description: Gateway suspended
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_slot_id: { type: string }
                  status: { type: string, example: SUSPENDED }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not manager/owner }
        '404': { description: Unknown or foreign gateway slot }
        '409': { description: The slot is not in a suspendable state }

  /gateways/{gateway_slot_id}/resume/:
    post:
      tags: [Provisioning & Gateways]
      summary: Resume a SUSPENDED gateway — manager/owner (v0.5, ratified v1.7.2)
      description: >
        Restores PROVISIONED and re-syncs the EMQX allow rules, so publishes flow
        again without a reinstall. Only a SUSPENDED gateway can be resumed —
        anything else is a 409.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: gateway_slot_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Gateway resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_slot_id: { type: string }
                  status: { type: string, example: PROVISIONED }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not manager/owner }
        '404': { description: Unknown or foreign gateway slot }
        '409': { description: The slot is not SUSPENDED }

  /gateways/{gateway_slot_id}/rotate-credential/:
    post:
      tags: [Provisioning & Gateways]
      summary: Stage a gateway credential rotation — manager/owner (v0.5, ratified v1.7.2)
      description: >
        Stages a rotation and returns the new plaintext password EXACTLY ONCE
        (later fetches see only the hash). The old credential keeps working at
        the broker until the device ACKs the new one, so a lost response can
        never lock a gateway out. Requires a PROVISIONED gateway (409 otherwise).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: gateway_slot_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Rotation staged (password shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_slot_id: { type: string }
                  username: { type: string }
                  password: { type: string }
                  rotation_pending: { type: boolean, example: true }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not manager/owner }
        '404': { description: Unknown or foreign gateway slot }
        '409': { description: The slot is not PROVISIONED }

  /gateways/{gateway_slot_id}/rotation-ack/:
    post:
      tags: [Provisioning & Gateways]
      summary: Commit a staged rotation (commit-on-ACK) — manager/owner (v0.5, ratified v1.7.2)
      description: >
        Promotes the staged hash to active only when the presented
        new_password matches it — that match is the proof the device received
        the rotation. No staged rotation, or a mismatch, is a 409.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: gateway_slot_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password: { type: string }
      responses:
        '200':
          description: Rotation committed
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway_slot_id: { type: string }
                  rotation_committed: { type: boolean, example: true }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not manager/owner }
        '404': { description: Unknown or foreign gateway slot }
        '409': { description: No staged rotation, or the password does not match it }

  /gateways/{slot}/:
    get:
      tags: [Ops]
      summary: One gateway + saloon zones + active hardware (manager+)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: slot, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Gateway detail }
        '404': { description: Unknown or foreign gateway (identical) }

  /gateways/{slot}/diagnostics/:
    get:
      tags: [Ops]
      summary: Last retained gateway diagnostics (engineer+)
      description: >
        Serves the diag:last:{slot} Redis hash written by the subscriber for
        diagnostics-only self-reports (Firmware §3.8). 404 {"error":"no
        diagnostics yet"} when the gateway never reported (or Redis down —
        honest degradation).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: slot, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Last diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot_id: { type: string }
                  reported_at: { type: string, nullable: true }
                  battery_v: { type: number, nullable: true }
                  rssi: { type: number, nullable: true }
                  free_heap: { type: number, nullable: true }
                  sd_ok: { type: boolean, nullable: true }
                  errors:
                    type: array
                    items: { type: string }
        '404': { description: No diagnostics yet, or unknown/foreign slot (404 either way) }

  /auth/password/change/:
    post:
      tags: [Authentication]
      summary: Change own password (any authenticated user; 3/min auth_strict)
      description: >
        {current_password, new_password} — new ≥10 chars, denylist + Django
        validators. 401 wrong current; 400 weak/new-equals-old; 429 past
        3/min per user. All the caller's refresh lines die (user_sessions
        rows revoked; jti-checked at refresh).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: Password changed }
        '400': { description: Weak or identical new password }
        '401': { description: Wrong current password }
        '429': { description: Past the 3/min auth_strict lane }

  /auth/sessions/:
    get:
      tags: [Authentication]
      summary: List OWN live sessions (any authenticated user)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The caller's session register
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    created_at: { type: string, nullable: true }
                    last_seen_at: { type: string, nullable: true }
                    ip: { type: string, nullable: true }
                    user_agent: { type: string, nullable: true }
                    current: { type: boolean }

  /auth/sessions/{session_id}/:
    delete:
      tags: [Authentication]
      summary: Revoke one of OWN sessions
      description: >
        404 identical for foreign/unknown ids (never an existence oracle);
        revocation kills the refresh line (jti-checked at refresh; access
        token expires within 15 min).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revoked }
        '404': { description: Unknown or foreign session (identical) }

  # ------------------------------------------------------------------
  # v1.7.8 — daily reconciliation ledger (v0.9/B5, M9-02 tooling)
  # ------------------------------------------------------------------
  /reconciliation/:
    get:
      tags: [Monitoring]
      summary: Daily delivery ledger per Tehran day (v0.9/B5)
      description: >
        DB rows + DLQ rows (with reason/gateway attribution) + alert list
        per org. accounted_pct is the pilot delivery gate. Engineer+ reads,
        claim-org scoped; ?day= defaults to yesterday Tehran.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: day, in: query, required: false, schema: { type: string, example: '2026-09-10' } }
      responses:
        '200':
          description: Ledger rows
        '403':
          description: Caller lacks engineer+ in this org

  # ------------------------------------------------------------------
  # v1.7.2 — follow-through CORE (F1–F15, docs/api-followthrough-v1.md):
  # topology writes, the flock cycle's two missing writers, the org alert
  # feed, the org home rollup and the mute windows. Additive-only: every path
  # below is NEW (two of them EXTEND an existing path's method set — see the
  # note on /farms/ and /saloons/{saloon_id}/).
  # ------------------------------------------------------------------
  /farms/:
    get:
      tags: [Farms]
      summary: List farms (v1.6 native list)
      description: >
        FarmOverview[] for the caller's org (v1.6 native list). ?org_id= is
        honored only when it EQUALS the validated claim org; a mismatch is 403.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Farms of the caller's org
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FarmOverview'
        '401': { description: Invalid or missing token }
        '403': { description: org_id does not match the claim org }
    post:
      tags: [Farms]
      summary: F1 — create a farm (owner)
      description: >
        Owner-exclusive (the locked "owner creates farms" rule, Tracker §4d
        R3-ACTOR-MAP). The org comes from the validated claim, never the body.
        Geography is validated: province_id/city_id are required and must exist,
        and an optional village_id must belong to that city. The new farm starts
        with zero saloons, and its farm-<id> legacy_slug_map row is minted in the
        SAME transaction so the Flutter compat aliases resolve it immediately —
        waiting for the backfill command would 404 a farm that exists. Writes a
        FARM_CREATED audit row. NOTE: this EXTENDS the existing /farms/ path with
        a second method on purpose — a separate route would never be reached.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, province_id, city_id]
              properties:
                name: { type: string, maxLength: 255, example: Farm A }
                province_id: { type: integer, example: 1 }
                city_id: { type: integer, example: 1 }
                village_id: { type: integer, nullable: true, example: 1 }
      responses:
        '201':
          description: Farm created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOverview'
        '400': { description: Invalid name, missing/unknown geography, or a village outside the city }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not the org owner }

  /farms/{farm_id}/:
    patch:
      tags: [Farms]
      summary: F2 — rename a farm (owner)
      description: >
        Name-only edit. Geography is deliberately immutable: re-homing a farm
        re-homes every scope row and regional rollup, so it is a migration, not a
        rename. Foreign/unknown id → 404; a farm outside the caller's
        account_role_scopes rows → 403. Writes FARM_UPDATED and returns the
        farm's FarmOverview.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farm_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Farm renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOverview'
        '400': { description: Missing or invalid name }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not the org owner, or the farm is outside their scope }
        '404': { description: Unknown or foreign farm }
    delete:
      tags: [Farms]
      summary: F3 — delete an empty farm (owner)
      description: >
        Hard delete, only while the farm has NO saloons — the RESTRICT
        philosophy, never a cascade. A farm that still owns a saloon is 409
        {"error": "farm not empty"}; one still referenced by history (alert
        instances, command logs) is a 409 naming the relation, never a 500. The
        legacy_slug_map rows are left in place: ids are never re-issued. Writes
        FARM_DELETED in the same transaction as the delete.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farm_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Farm deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  farm_id: { type: integer }
                  deleted: { type: boolean, example: true }
        '401': { description: Invalid or missing token }
        '403': { description: Caller is not the org owner, or the farm is outside their scope }
        '404': { description: Unknown or foreign farm }
        '409': { description: Farm still has saloons, or is still referenced by history }

  /farms/{farm_id}/saloons/:
    post:
      tags: [Farms]
      summary: F4 — add a saloon to a farm (manager+)
      description: >
        Creates one saloon under a farm of the caller's org; positions start
        EMPTY by design (F7 adds them one at a time). The saloon inherits the
        farm's org and gets its device-<id> compat slug in the same transaction
        (the farm/org slug rows come with it). Foreign/unknown farm → 404; a farm
        outside the caller's scope rows → 403. Returns SaloonDetail and writes
        SALOON_CREATED.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farm_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255, example: Saloon 3 }
      responses:
        '201':
          description: Saloon created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonDetail'
        '400': { description: Missing or invalid name }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the farm is outside their scope }
        '404': { description: Unknown or foreign farm }

  /saloons/{saloon_id}/:
    get:
      tags: [Farms]
      summary: Saloon detail
      description: >
        Full saloon record: identity, geography, operational state, flock age,
        gateway binding and sensor slots. Nulls are honest (no flock, no zone,
        Redis down). Foreign/unknown saloon → 404.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Saloon detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonDetail'
        '401': { description: Invalid or missing token }
        '404': { description: Unknown or foreign saloon }
    patch:
      tags: [Farms]
      summary: F5 — rename a saloon (manager+)
      description: >
        Name-only. The operational state keeps its own endpoint (the canonical
        loop owns it) and the threshold-template assignment keeps O16, so a
        rename can never move a live alarm band. Foreign/unknown → 404; outside
        the caller's scope → 403. Writes SALOON_UPDATED and returns SaloonDetail.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Saloon renamed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonDetail'
        '400': { description: Missing or invalid name }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the saloon is outside their scope }
        '404': { description: Unknown or foreign saloon }
    delete:
      tags: [Farms]
      summary: F6 — delete an empty saloon (manager+)
      description: >
        Hard delete, only while the saloon has NO flock history at all and NO
        telemetry history. Stricter than the spec's "no active flock": the
        schema makes flock_cycles.saloon ON DELETE RESTRICT, so a saloon that
        ever housed a flock — a closed cycle included — can never be hard
        deleted. The saloon id is what telemetry, alerts, reports and cycles key
        off, which is why each verdict above preserves it. Verdicts: 409
        "saloon has an active flock", 409 "saloon has flock history", 409
        "saloon has telemetry history", or 409 naming the still-referencing
        relation (positions, sensor slots, gateway bindings). The compat slug row
        stays (ids are never re-issued). Writes SALOON_DELETED in the same
        transaction, and only after the delete succeeded.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Saloon deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  saloon_id: { type: string }
                  deleted: { type: boolean, example: true }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the saloon is outside their scope }
        '404': { description: Unknown or foreign saloon }
        '409': { description: Active flock, telemetry history, or a still-referencing relation }

  /saloons/{saloon_id}/positions/:
    post:
      tags: [Farms]
      summary: F7 — add a physical position to a saloon (manager+)
      description: >
        One named position ("North Wall", …). The sensor hierarchy is saloon →
        position → sensor slot, so this step must exist before a slot can be
        bound. UNIQUE(saloon_id, label) stands: a duplicate label is 409
        (pre-checked and backed by the constraint, so a concurrent double-submit
        behaves). Foreign/unknown saloon → 404; outside the caller's scope → 403.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 100, example: North Wall }
      responses:
        '201':
          description: Position created
          content:
            application/json:
              schema:
                type: object
                properties:
                  position_id: { type: integer }
                  saloon_id: { type: string }
                  label: { type: string }
                  created_by: { type: integer, nullable: true }
        '400': { description: Missing or invalid label }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the saloon is outside their scope }
        '404': { description: Unknown or foreign saloon }
        '409': { description: A position with this label already exists }

  /saloons/{saloon_id}/positions/{position_id}/:
    patch:
      tags: [Farms]
      summary: F8 — rename a position (manager+, label only)
      description: >
        Renames one position; sensor bindings follow automatically because the
        mapping rows reference the position by id, so nothing is re-bound and no
        telemetry history moves. LABEL ONLY: the follow-through draft also listed
        an is_active toggle here, but saloon_positions has no such column and the
        core schema is frozen — the erratum is recorded in the spec
        (docs/api-followthrough-v1.md F8) instead of an ALTER. A duplicate label
        is 409 like F7.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: position_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Position renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  position_id: { type: integer }
                  saloon_id: { type: string }
                  label: { type: string }
                  created_by: { type: integer, nullable: true }
        '400': { description: Missing or invalid label }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the saloon is outside their scope }
        '404': { description: Unknown saloon or position }
        '409': { description: A position with this label already exists }

  /saloons/{saloon_id}/flocks/{flock_id}/close/:
    patch:
      tags: [Farms]
      summary: F14 — close the active flock cycle (engineer+)
      description: >
        Sets flock_cycles.end_date — the write this table never had, and the one
        every downstream reader waits for: the KPI windows, the quality service's
        per-cycle verdicts and the threshold hash all key off `end_date IS NULL`
        meaning "active". Only the saloon's ACTIVE cycle can be closed (already
        closed → 400 "no active flock"), and end_date may not precede
        start_date. The save fires the existing flock_cycles.post_save fast path,
        which re-arms the saloon's threshold hash immediately. SNAPSHOT
        FINALIZATION IS NOT PART OF THIS ENDPOINT: flock_daily_snapshots and the
        aggregates module that would write it exist in no wave yet (erratum in
        docs/api-followthrough-v1.md F14).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: flock_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [end_date]
              properties:
                end_date:
                  type: string
                  description: YYYY-MM-DD or ISO datetime (naive = Asia/Tehran)
                  example: '2026-09-12'
      responses:
        '200':
          description: Cycle closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  flock_id: { type: integer }
                  saloon_id: { type: string }
                  end_date: { type: string, format: date }
                  status: { type: string, example: CLOSED }
        '400': { description: Missing/unparseable end_date, end_date < start_date, or no active flock }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks engineer+, or the saloon is outside their scope }
        '404': { description: Unknown saloon/flock, or a flock of another saloon (400 when it is in-org) }

  /saloons/{saloon_id}/flocks/{flock_id}/mortality/:
    post:
      tags: [Farms]
      summary: F15 — record deaths directly (engineer+)
      description: >
        The writer mortality_records never had. GET /saloons/{id}/kpis/ computes
        mortality_pct and the daily series from THIS table while the daily report
        stores its own mortality_count, so before this endpoint the
        farmer-facing mortality figure could only ever read zero. Direct entry
        sits BESIDE the report counts: this endpoint never rewrites a report and
        a report never writes here. occurred_on is a Tehran calendar day stored
        at 00:00 Asia/Tehran (the same day boundary the KPI groups by); it may
        not be in the future nor precede the cycle start. count ≥ 1. cause is an
        additive extension of the draft (the column exists and was unreachable).
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: flock_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occurred_on, count]
              properties:
                occurred_on: { type: string, example: '2026-09-11' }
                count: { type: integer, minimum: 1, example: 15 }
                cause: { type: string, maxLength: 100, example: heat_stress }
                note: { type: string, example: Heat spike during the fan outage }
      responses:
        '201':
          description: Mortality row recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  mortality_id: { type: integer }
                  flock_id: { type: integer }
                  saloon_id: { type: string }
                  count: { type: integer }
                  occurred_on: { type: string, format: date }
                  recorded_by: { type: integer }
                  cause: { type: string, nullable: true }
                  notes: { type: string, nullable: true }
        '400': { description: Missing/unparseable day, count < 1, future day, or a day before the cycle start }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks engineer+, or the saloon is outside their scope }
        '404': { description: Unknown saloon or flock (a flock of another saloon answers 400 when it is in-org) }

  /overview/:
    get:
      tags: [Farms]
      summary: F10 — org home rollup (any member)
      description: >
        Every farm of the caller's org with saloon count, unresolved-alert count
        and highest active tier, plus org totals — the multi-farm home view that
        GET /farms/{id}/overview/ (one farm at a time) never gave. Aggregates are
        computed in bulk (no per-farm query) and both RLS and the caller's
        account_role_scopes rows narrow the farms, the saloons and the totals.
        highest_tier is null when nothing is unresolved, never 0.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Farm rollup + totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  farms:
                    type: array
                    items:
                      type: object
                      properties:
                        farm_id: { type: integer }
                        name: { type: string }
                        saloon_count: { type: integer }
                        active_alert_count: { type: integer }
                        highest_tier: { type: integer, nullable: true }
                  totals:
                    type: object
                    properties:
                      farm_count: { type: integer }
                      saloon_count: { type: integer }
                      active_alert_count: { type: integer }
                      highest_tier: { type: integer, nullable: true }
        '400': { description: The token carries no org context }
        '401': { description: Invalid or missing token }

  /alerts/:
    get:
      tags: [Alerts]
      summary: F9 — org-wide alert feed (engineer+)
      description: >
        Every alert of the caller's org, newest first, {results, count} paginated
        — the org-wide sibling of GET /saloons/{id}/alerts/ ("what is on fire
        right now" for a whole farm or org). Filters: farm_id, saloon_id, status
        (ACTIVE default / ALL), tier (1-3 on highest_tier_reached) and metric
        (metric key). Each is validated — an unknown tier or metric key is 400,
        because a typo that silently narrows a feed reads exactly like "nothing
        is wrong". The caller's account_role_scopes rows narrow the result set
        like every other read surface.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: farm_id, in: query, required: false, schema: { type: integer } }
        - { name: saloon_id, in: query, required: false, schema: { type: integer } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, ALL] } }
        - { name: tier, in: query, required: false, schema: { type: integer, enum: [1, 2, 3] } }
        - { name: metric, in: query, required: false, schema: { type: string }, example: nh3 }
      responses:
        '200':
          description: Alert page
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertInstance'
                  count: { type: integer }
        '400': { description: Bad status/tier/metric, or invalid pagination }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks engineer/manager/owner }

  /maintenance-mutes/:
    get:
      tags: [Alerts]
      summary: F11 — list maintenance-mute windows (manager+)
      description: >
        First READ path for maintenance_mutes. active_only=true (default) keeps
        only windows the engine would honour right now
        (starts_at ≤ now < ends_at); false returns the history. saloon_id narrows
        to one saloon. Rows are newest-first with {results, count}, always
        claim-org scoped and then narrowed by the caller's scope rows.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
        - { name: saloon_id, in: query, required: false, schema: { type: integer } }
        - { name: active_only, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Mute page
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MaintenanceMute'
                  count: { type: integer }
        '400': { description: Bad saloon_id/active_only, or invalid pagination }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner }
    post:
      tags: [Alerts]
      summary: F12 — open a maintenance-mute window (manager+)
      description: >
        First WRITE path for maintenance_mutes — the table was read by every
        alert evaluation and writable only from the ORM (the model's "managed via
        Django Admin" note is superseded in v1.7.2: no admin registration ever
        shipped). While the window covers "now", threshold-crossing and
        duration-filter alerts for that saloon are SUPPRESSED — readings still
        log, and Tier-1 velocity (NH3/temp) still pages: Decision 10 is enforced
        in the evaluation path and cannot be reached from here. Rules: ends_at
        after starts_at, window ≤ 72 h, no overlap with another window of the
        same saloon (abutting windows are allowed). A window already over is 400;
        one that has started but not ended is accepted. Writes MUTE_CREATED.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [saloon_id, starts_at, ends_at, reason]
              properties:
                saloon_id: { type: integer, example: 7 }
                starts_at: { type: string, example: '2026-09-12T06:00:00Z' }
                ends_at: { type: string, example: '2026-09-12T12:00:00Z' }
                reason: { type: string, maxLength: 200, example: Exhaust fan replacement }
      responses:
        '201':
          description: Mute window created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceMute'
        '400': { description: 'Bad window (order, > 72 h, entirely past) or missing/invalid fields' }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the saloon is outside their scope }
        '404': { description: Unknown or foreign saloon }
        '409': { description: The window overlaps an existing window for this saloon }

  /maintenance-mutes/{mute_id}/:
    delete:
      tags: [Alerts]
      summary: F13 — revoke a mute window (manager+)
      description: >
        Ends a window early so alerting resumes at once. Two honest branches,
        because maintenance_mutes carries CHECK(ends_at > starts_at): a RUNNING
        window has ends_at shortened to the revocation instant (row and history
        kept); a NOT-YET-STARTED window's row is removed (it suppressed nothing,
        and there is no honest way to move a future window into the past). A
        window that already ended is 409 "mute is not active". Either way a
        MUTE_REVOKED audit row is written — the audit trail is never lost.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: mute_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Window revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  mute_id: { type: integer }
                  saloon_id: { type: string, nullable: true }
                  ends_at: { type: string }
                  status: { type: string, example: REVOKED }
        '401': { description: Invalid or missing token }
        '403': { description: Caller lacks manager/owner, or the saloon is outside their scope }
        '404': { description: Unknown or foreign mute }
        '409': { description: The mute is not active (already ended) }

  # ------------------------------------------------------------------
  # v1.7.0 — W1..W5 compat report aliases (M7-17; spec
  # docs/api-reports-merge-v1.md §5, error contract
  # docs/api-compat-flutter-v1.md §3/§8). The reports-only compat-write
  # exception (C-09 stands for everything else). Slugs resolve via
  # legacy_slug_map against the JWT org claim — unknown, foreign or
  # disagreeing slugs are 404 {"error": ...} (never a 400 oracle, never
  # 500); inverted from/to is 400. Reporter is always the JWT user.
  # Full /api/compat/v1 prefix is documented verbatim here (these routes
  # live outside /api/v1/); the legacy /api/... twins hit the same views.
  # ------------------------------------------------------------------
  /api/compat/v1/farms/{farmSlug}/salons/{salonSlug}/reports/:
    get:
      tags: [Compat Reports]
      summary: W1 — compat daily-report list (Flutter calendar/history)
      description: >
        Thin shim over GET /saloons/{saloon_id}/reports/: from/to/status
        semantics preserved verbatim (bare merged list, newest first).
        ?status=incomplete returns DRAFT+SUBMITTED (the Flutter dashboard
        queue); native callers use the v1.5 enum values.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farmSlug, in: path, required: true, schema: { type: string } }
        - { name: salonSlug, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Merged report list (bare array) }
        '400': { description: Inverted or unparseable from/to window }
        '404': { description: Unknown, foreign or disagreeing farm/salon slug }

  /api/compat/v1/farms/{farmSlug}/salons/{salonSlug}/reports/{report_date}/:
    get:
      tags: [Compat Reports]
      summary: W2 — compat single report by calendar day
      description: >
        Thin shim over GET /saloons/{saloon_id}/reports/{report_date}/:
        merged single shape; absent → 404; several flocks sharing the
        saloon+day → 400 multiple reports for date.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farmSlug, in: path, required: true, schema: { type: string } }
        - { name: salonSlug, in: path, required: true, schema: { type: string } }
        - { name: report_date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: The day's report (merged single shape) }
        '400': { description: Bad date, or several reports share the saloon+day }
        '404': { description: Unknown/foreign slug, or no report for the day }

  /api/compat/v1/farms/{farmSlug}/reports/:
    get:
      tags: [Compat Reports]
      summary: W5 — compat farm-level report queue (Flutter dashboard)
      description: >
        Every saloon of the farm in one bare merged list (newest first);
        ?status=incomplete returns DRAFT+SUBMITTED; from/to narrow the
        window. Other farms' reports never leak in.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: farmSlug, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: status, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Merged report list (bare array) }
        '400': { description: Inverted or unparseable from/to window }
        '404': { description: Unknown or foreign farm slug }

  /api/compat/v1/reports/:
    post:
      tags: [Compat Reports]
      summary: W3 — compat report write (slugs in body, reporter = JWT user)
      description: >
        Thin shim over POST /saloons/{saloon_id}/reports/. Body carries
        farm_slug + salon_slug (both required; must agree — the salon's
        farm == the farm, mismatch is 404, never a 400 oracle) plus every
        §2 canonical/alias field. Aliases, checklist enforcement, FLAGGED
        auto-ticket and reporter=JWT-user ride along; any client-sent
        reporter key is ignored.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_slug, salon_slug, flock_id, report_date]
              properties:
                farm_slug: { type: string }
                salon_slug: { type: string }
                flock_id: { type: integer }
                report_date: { type: string, format: date }
                mortality_count: { type: integer, minimum: 0 }
                casualties_today: { type: integer, minimum: 0, description: Input alias of mortality_count }
                feed_kg: { type: number }
                feed_consumed_kg: { type: number, description: Input alias of feed_kg }
                water_l: { type: number }
                water_consumed_l: { type: number, description: Input alias of water_l }
                avg_weight_g: { type: number }
                avg_sample_weight_g: { type: number, description: Input alias of avg_weight_g }
                status: { type: string, enum: [DRAFT, SUBMITTED] }
                is_draft: { type: boolean }
                bird_count: { type: integer, minimum: 0 }
                avg_temperature_c: { type: number }
                avg_humidity_pct: { type: number, minimum: 0, maximum: 100 }
                ventilation_status: { type: string, enum: [STABLE, NEEDS_REVIEW, PROBLEM] }
                health_status: { type: string, enum: [NORMAL, WARNING, CRITICAL] }
                checklist:
                  type: object
                  properties:
                    feed: { type: boolean }
                    water: { type: boolean }
                    device: { type: boolean }
                notes: { type: string }
                medications:
                  type: array
                  items:
                    type: object
                    properties:
                      catalog_item_id: { type: integer, nullable: true }
                      medication_name: { type: string }
                      dosage: { type: string }
                      frequency: { type: string }
      responses:
        '201': { description: Report created (aliases normalized, reporter = JWT user) }
        '400': { description: Missing slugs, duplicate flock/saloon/date, conflicting aliases, or checklist incomplete }
        '404': { description: Unknown, foreign or disagreeing farm/salon slug }

  /api/compat/v1/reports/{report_id}/:
    patch:
      tags: [Compat Reports]
      summary: W4 — compat report edit (aliases accepted)
      description: >
        Thin shim over PATCH /reports/{report_id}/: same Tehran-day
        time-lock, in-play checklist scoping and staff-exempt audit.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: report_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mortality_count: { type: integer, minimum: 0 }
                casualties_today: { type: integer, minimum: 0, description: Input alias of mortality_count }
                feed_kg: { type: number }
                feed_consumed_kg: { type: number, description: Input alias of feed_kg }
                water_l: { type: number }
                water_consumed_l: { type: number, description: Input alias of water_l }
                avg_weight_g: { type: number }
                avg_sample_weight_g: { type: number, description: Input alias of avg_weight_g }
                notes: { type: string }
                status: { type: string, enum: [DRAFT, SUBMITTED] }
                is_draft: { type: boolean }
                bird_count: { type: integer, minimum: 0 }
                avg_temperature_c: { type: number }
                avg_humidity_pct: { type: number, minimum: 0, maximum: 100 }
                ventilation_status: { type: string, enum: [STABLE, NEEDS_REVIEW, PROBLEM] }
                health_status: { type: string, enum: [NORMAL, WARNING, CRITICAL] }
                checklist:
                  type: object
                  properties:
                    feed: { type: boolean }
                    water: { type: boolean }
                    device: { type: boolean }
      responses:
        '200': { description: Report updated }
        '400': { description: Conflicting alias fields, or checklist incomplete on SUBMITTED }
        '403': { description: Edit window closed or caller lacks edit rights }
        '404': { description: Report not found }

  /alert-subscriptions/:
    get:
      tags: [Alerts]
      summary: List muted alert categories with suppression counts (v0.9/B2)
      description: >
        Org-wide category mutes (GS-ROUTING). Any member reads; the red banner
        renders from this list. suppressed_today is the Redis digest per metric.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Mute list with digest counts
        '403':
          description: Missing org context
    post:
      tags: [Alerts]
      summary: Mute an alert category org-wide, manager+ (v0.9/B2)
      description: >
        Creates the row the engine lane 2c honours. Re-muting is idempotent.
        Tier-1 velocity bypasses every mute structurally (Decision 10).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metric_key]
              properties:
                metric_key: { type: string, example: lux }
                reason: { type: string }
      responses:
        '200':
          description: Category muted (or already muted yields idempotent)
        '400':
          description: Missing or unknown metric_key
        '403':
          description: Caller lacks manager/owner

  /alert-subscriptions/{metric_key}/:
    delete:
      tags: [Alerts]
      summary: Unmute an alert category, manager+ (v0.9/B2)
      description: >
        Deletes the mute row -- the category re-arms immediately. Unknown metric
        is 404.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: metric_key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Category unmuted
        '403':
          description: Caller lacks manager/owner
        '404':
          description: Metric not muted

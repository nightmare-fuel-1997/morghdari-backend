  /platform/support/hardware/gateways/{hw_id}/replace/:
    post:
      tags: [Platform Support]
      summary: Swap the live gateway unit with fresh credentials (v0.9 H3)
      description: >
        One atomic ceremony: retire the old unit, register the new serial,
        and set a FRESH MQTT password on the slot credential (old password
        dies with the swap). The plaintext returns EXACTLY ONCE — replays
        answer idempotent:true with an empty password and never re-issue.
        Broker push is FNV-soft. Writes SUPPORT_OP_HW_REPLACE (never the
        plaintext).
      security: [{ BearerAuth: [] }]
      parameters:
        - name: hw_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_hardware_id, reason]
              properties:
                new_hardware_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Swap complete (or replayed → idempotent); audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Hardware row not active in the session org
        '409':
          description: New serial already live in this org

  /platform/support/hardware/gateways/{slot_id}/acl-backfill/:
    post:
      tags: [Platform Support]
      summary: Backfill the full T1–T9 MQTT rule set onto a slot (v0.9 H4)
      description: >
        Slots approved before M8-04-H carry telemetry/status rules only.
        Creates the missing allow-rows from the canonical set (additive-only,
        re-runs add zero) and re-pushes the broker sync. Writes
        SUPPORT_OP_HW_ACL_BACKFILL.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: slot_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Rule set complete; audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Gateway slot not found in the session org

  /platform/support/tasks/drain/:
    post:
      tags: [Platform Support]
      summary: Trigger drain_pending_approval / cache-rebuild task (whitelisted op, v1.2)
      description: >
        Requires an ACTIVE support session for the target org. Dispatches the named
        maintenance task (drain_pending_approval, cache rebuilds) and writes a
        SUPPORT_OP_* audit row with the incident_id.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task, reason]
              properties:
                task:
                  type: string
                  enum: [drain_pending_approval, rebuild_threshold_cache, rebuild_zone_cache]
                gateway_slot_id: { type: string, description: Required for drain_pending_approval }
                reason: { type: string }
      responses:
        '202':
          description: Task dispatched; audit row written
        '403':
          description: No active support session for this org
        '400':
          description: Task requires gateway_slot_id which is missing

  /saloons/{saloon_id}/flocks/{flock_id}/weight-samples/:
    post:
      tags: [Flock Production]
      summary: Log a bird weight sample (FCR input — v1.3, manual entry)
      description: >
        Requires engineer+ role for the saloon. Records one sampling event
        (Saas Decision 22): sample_size birds weighed, avg/min/max grams,
        optional uniformity_pct (% within ±10% of mean). Source is 'manual'
        in v1; 'device' is reserved for future weigh-station integration.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: flock_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sample_size, avg_weight_g]
              properties:
                sampled_at: { type: string, format: date-time }
                sample_size: { type: integer, minimum: 1 }
                avg_weight_g: { type: number }
                min_weight_g: { type: number }
                max_weight_g: { type: number }
                uniformity_pct: { type: number }
                notes: { type: string }
      responses:
        '201': { description: Sample recorded }
        '403': { description: Caller lacks engineer role for this saloon }
    get:
      tags: [Flock Production]
      summary: List weight samples for a flock (newest first)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: flock_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Weight samples
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sampled_at: { type: string, format: date-time }
                    sample_size: { type: integer }
                    avg_weight_g: { type: number }
                    uniformity_pct: { type: number }
                    source: { type: string }

  /saloons/{saloon_id}/flocks/{flock_id}/feed-intake/:
    post:
      tags: [Flock Production]
      summary: Upsert daily feed intake for a flock (FCR input — v1.3)
      description: >
        Requires engineer+ role. ONE row per flock per day (UNIQUE(flock_id,
        entry_date)) — re-posting the same date UPDATES it (corrections are
        audited). feed_kg = consumed = delivered − remaining.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: flock_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entry_date, feed_kg]
              properties:
                entry_date: { type: string, format: date }
                feed_kg: { type: number }
                feed_type: { type: string, enum: [starter, grower, finisher] }
                notes: { type: string }
      responses:
        '200': { description: Upserted (created or corrected) }
        '403': { description: Caller lacks engineer role for this saloon }
    get:
      tags: [Flock Production]
      summary: List daily feed intake rows for a flock
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: flock_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Feed intake rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    entry_date: { type: string, format: date }
                    feed_kg: { type: number }
                    feed_type: { type: string }
                    source: { type: string }

  /saloons/{saloon_id}/kpis/:
    get:
      tags: [Flock Production]
      summary: Computed flock KPIs (mortality %, compliance %, FCR, cycle summary — v1.3)
      description: >
        Computed per request (Saas Decision 22 — no materialization in v1).
        metrics accepts any subset: mortality_pct, compliance_pct, fcr,
        cycle_summary. FCR is null until BOTH a weight sample and feed data
        exist — never 0, never an error. Defaults to the saloon's active flock.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: saloon_id, in: path, required: true, schema: { type: integer } }
        - { name: metrics, in: query, required: false, schema: { type: string, default: "mortality_pct,compliance_pct,fcr,cycle_summary" } }
        - { name: flock_id, in: query, required: false, schema: { type: integer, description: Defaults to the active flock } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: KPI bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  flock_id: { type: integer }
                  mortality_pct: { type: number, nullable: true }
                  daily_mortality_pct: { type: array, items: { type: object } }
                  compliance_pct: { type: number, nullable: true }
                  fcr: { type: number, nullable: true, description: Null until weight + feed data exist }
                  cycle_summary:
                    type: object
                    nullable: true
                    properties:
                      days_elapsed: { type: integer }
                      cumulative_mortality_pct: { type: number }
                      latest_fcr: { type: number, nullable: true }
                      alert_count: { type: integer }
                      compliance_pct: { type: number }
        '404': { description: No flock found (and no active flock) }

  /me/dashboard-config/:
    get:
      tags: [Dashboard]
      summary: My resolved dashboard widget config (v1.3)
      description: >
        Returns the RESOLVED widget set (personal override → role default →
        system default) for the caller's current role context, plus which
        layer each value came from.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Resolved config
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  widgets: { type: object, additionalProperties: { type: boolean } }
                  resolved_from: { type: object, additionalProperties: { type: string, enum: [personal, role_default, system_default] } }
    put:
      tags: [Dashboard]
      summary: Upsert MY personal widget overrides (v1.3)
      description: >
        Writes/updates only the caller's own personal row (dashboard_configs
        where user_id = caller). Partial updates allowed — keys not sent keep
        their current resolution.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widgets]
              properties:
                widgets: { type: object, additionalProperties: { type: boolean } }
      responses:
        '200': { description: Personal overrides saved }
        '403': { description: Cannot write another user's row }

  /dashboard-config/{role}/:
    get:
      tags: [Dashboard]
      summary: Read a role's default widget set (v1.3)
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [owner, manager, engineer, doctor, worker] } }
      responses:
        '200':
          description: Role default row (or the system default when none set)
          content:
            application/json:
              schema:
                type: object
                properties:
                  role: { type: string }
                  widgets: { type: object, additionalProperties: { type: boolean } }
                  is_system_default: { type: boolean }
    put:
      tags: [Dashboard]
      summary: Set a role's default widget set (v1.3)
      description: Requires owner/admin for the org. Writes the role-default row (user_id IS NULL); every user of that role inherits it unless they have a personal override.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [owner, manager, engineer, doctor, worker] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [widgets]
              properties:
                widgets: { type: object, additionalProperties: { type: boolean } }
      responses:
        '200': { description: Role default saved }
        '403': { description: Caller is not owner/admin for this org }

  /saloons/{saloon_id}/flocks/{flock_id}/water-intake/:
    post:
      tags: [Flock Production]
      summary: Log daily water intake (v1.4 — manual, device-ready)
      description: >

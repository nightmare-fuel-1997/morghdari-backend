openapi: "3.0.3"
info:
  title: Morghdari Poultry Monitoring API
  version: "1.7.8"
  description: |
    REST API for the Morghdari multi-tenant poultry monitoring platform.
    WebSocket protocol is documented separately in the Frontend Integration Spec.

    v1.7.8 (2026-09-12 — daily reconciliation ledger, v0.9/B5): engineer+
    GET /reconciliation/ (DB rows + DLQ rows + alert list per Tehran day).

    v1.7.7 (2026-09-12 — public status page, v0.9/B4 MET-STATUS):
    unauthenticated /status/ from blackbox probe history (14-day share per
    vantage, minimum headline, unknown-never-500).

    v1.7.6 (2026-09-12 — granular panels, v0.9/B3 D24-2): panel catalog +
    role gates + user overrides with the documented resolution chain
    (user override → role rows with deny-wins → default-open; owner_only
    panels absolute). Reviewer read-only falls out (no write admits them).

    v1.7.5 (2026-09-12 — alert-subscription mutes, v0.9/B2 GS-ROUTING):
    org-wide category mutes (manager+ writes, members read) honoured at a new
    evaluation lane ②c — muted categories never fire threshold alerts while
    Tier-1 velocity bypasses every mute structurally (Decision 10). Shipped
    org-scoped, not per-user (the planned /me/alert-subscriptions/ path is
    superseded — per-user routing arrives with v1.1 notifications).

    v1.7.4 (2026-09-12 — H3/H4 close the hardware track): the gateway
    replacement ceremony (retire + fresh one-time credential + broker
    continuity, replays never re-issue) and the T1–T9 downlink ACL backfill
    for pre-M8-04-H slots.

    v1.7.3 (2026-09-12 — the Hardware Team write path, v0.9 H0–H2): the six
    platform hardware endpoints (register + retire x gateway/sensor/actuator)
    behind the audited support session — serials no longer enter via direct
    DB writes. Idempotent re-register, 409 on occupied slots, 404 across orgs.

    v1.7.2 (2026-09-12 — the follow-through CORE wave, docs/api-followthrough-v1.md
    F1–F15 + the member role change, pulled forward from the v1.9.0 surface): the
    tenant topology finally has write paths — an owner creates, renames and
    deletes an EMPTY farm (409 "farm not empty" otherwise), manager+ adds and
    deletes saloons (refused with an active flock or telemetry history) and
    their physical positions, and EVERY farm/saloon creation mints its
    legacy_slug_map row in the same transaction so the Flutter aliases resolve a
    brand-new farm immediately instead of 404ing until someone re-runs the
    backfill command. The two writers the engine was missing are here: flock
    close — the only setter of flock_cycles.end_date, which re-arms the saloon's
    threshold hash through the existing post_save fast path — and direct
    mortality entry, because mortality_records had NO writer at all while
    /saloons/{id}/kpis/ computed mortality_pct and its daily series from it (a
    farm-facing number that could only ever read zero). Maintenance mutes gain
    their first REST surface (the table was read by every alert evaluation and
    writable only from the ORM — the model said "managed via Django Admin", and
    no admin registration ever shipped), and /alerts/ becomes the org-wide feed
    beside the per-saloon read. PATCH /org/members/{member_id}/ changes a role
    (owner-only, self-change refused, live refresh lines revoked because claims
    are frozen at token birth) and the `reviewer` role the v1.5 reports wave
    defined is now GRANTABLE — the invite enum had rejected it, so no org could
    produce one. Erratum ratified: the four manager-side gateway lifecycle twins
    (suspend / resume / rotate-credential / rotation-ack) are documented here for
    the first time, which empties the contract gate's ERRATUM_PENDING set.
    Additive-only: zero new tables, zero migrations, no change to any existing
    path and no change to the gateway state machine or the mute/velocity rules
    (NH3 and temp velocity still always page).

    v1.7.1 (2026-09-12 owner decision — the threshold-template WRITE surface,
    O13–O16, additive to the v1.7.0 union): an engineer authors DRAFTS inside the
    farms granted via account_role_scopes (fail-closed — no scope row = 403),
    edits them while still drafts (PUT, 409 once published); owner/manager
    publishes (POST …/publish/, 409 when the breed or org-default slot is taken)
    and assigns per saloon (PUT …/threshold-template/, template_id: null clears).
    ONLY a PUBLISHED template arms alarms, so authoring cannot move a live band;
    publish and assign re-cache the affected saloons in the same request. Pure
    growth surface stays reserved for 1.8.0.

    v1.7.0 (union — ops wave M6-10 + reports merge M7-16/M7-17, Tracker §4p/§4s):
    merged daily-report schemas (Flutter input aliases normalized server-side,
    extras keys appended, is_completed + reported_by/reported_at) plus the
    W1–W5 compat report aliases under /api/compat/v1 (slugs via
    legacy_slug_map, reporter = JWT user, ?status=incomplete = DRAFT +
    SUBMITTED). 1.8.0 stays reserved.

    v1.5.0 (2026-09-04 owner-approved plan, Tracker §4n): Daily Reports +
    Ticketing + Panel Permissions + Alert Subscriptions + Farm Events. New role
    `reviewer` (READ-ONLY on daily reports org-wide, no approve/reject).
    Report state machine DRAFT→SUBMITTED→APPROVED/REJECTED plus FLAGGED branch
    (report WITH medication → FLAGGED + auto medical ticket + WS push to
    doctor); edit time-lock same calendar day Asia/Tehran, cutoff 00:00 sharp.
    Panels default OPEN (can_view=true); per-role/user overrides via /panels/.
    Alert subscriptions mute a category but NEVER Tier-1 velocity (DECISION
    6=A, owner 2026-09-04 — Decision 10 stands, NH3/temp velocity always page;
    mute checked before every send, audit digest per suppression). Farm event
    reminders 24h before scheduled_at via alarm+SMS (notification_deliveries).
    support_tickets extends the doctor_tickets pattern (no new messaging system).

    v1.4.5 (2026-08-26 erratum, Tracker §4k/§4l): AlertInstance.metric_type
    enum widened with thi, co, power_mains, power_gen for the alert engine
    (v0.4). Documentation-only; these rows were already emittable.

    v1.4.4 (2026-08-25 erratum, Tracker §4j): /platform/support/session/ response
    now explicitly documents access_token — the description always said a scoped
    token is returned but the schema never listed the field.

    v1.4.3 (2026-08-25 auth & tenancy resolution session, Tracker §4j): adds
    org-member management — GET/POST /org/members/ and POST
    /org/members/{member_id}/deactivate/. Writes are owner-exclusive;
    deactivate sets is_active=false (never deletes); inviting over an INACTIVE
    membership REACTIVATES it (HTTP 200) — 409 fires only on an already-ACTIVE
    membership. No schema change: UNIQUE(org_id, user_id) stands.

    v1.4.2 (2026-08-23 third-pass review): POST /saloons/{saloon_id}/flocks/ now
    REQUIRES placement_count (NOT NULL in database.md — without it every flock
    creation violated the schema) and accepts optional day_old_weight_g.
    Found by the versions/ curriculum audit; tracked as Tracker §4i.

    v1.4.1 (2026-08-23 resolution session, Tracker §4i): POST /provisioning/sync/
    documents its 409 Conflict response (per-gateway concurrent-sync lock).
    Refresh-token rotation is intentionally NOT part of this contract — the feature
    is disabled server-side (owner decision 2026-08-23).

    v1.4.0 (GS-fix 2026-08-22, Saas Decision 23 — Capability-Based Modularity):
    water-intake logging (manual, device-ready), farm biosecurity event log, and
    GET /saloons/{id}/capabilities/ — the per-saloon capability profile: every
    optional feature reports available / unavailable + missing inputs + enable
    path. New sensor keys (water_l, co, power_mains, power_gen) flow through the
    metric catalog with zero further contract change.
    
    v1.3.0 (GS-fix 2026-08-22, Saas Decision 22): flock production KPIs — weight
    samples + feed intake logging (FCR inputs, manual entry), the KPI query
    endpoint (mortality %, compliance %, FCR, cycle summary), and per-actor
    dashboard widget toggles (role defaults + personal overrides).
    
    v1.2.0 (GS-fix 2026-08-22): platform support — the org-context session endpoint
    plus the three whitelisted support-op endpoints (Actor Map "Platform Support
    Engineer", Security §4.5). v1.1 paths are unchanged.
    
    v1.1.0 (R3-fix 2026-08-16): adds the operability endpoints required by the
    documented flows — FM provisioning approve/reject, alert acknowledgement,
    saloon operational-state transitions, flock cycles, gateway requests + review,
    and the extended /health/ payload. v1.0 paths are unchanged.
    
    Base URL: https://api.morghdari.com/api/v1/
    
    Authentication: Bearer JWT (15-min access token, 7-day refresh token).

servers:
  - url: https://api.morghdari.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    GatewayBasicAuth:
      type: http
      scheme: basic
      description: >
        Gateway device authentication for the zero-touch config endpoint.
        Username = gateway_slot_id, password = the current MQTT credential
        (validated against mqtt_device_credentials). See
        design-zero-touch-provisioning.md §3.1.

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: tom@goldenegg.com
        password:
          type: string
          format: password
        mfa_code:
          type: string
          description: >-
            Live TOTP code — REQUIRED for platform-staff accounts (v1.7.1, M7-07:
            Security Architecture §4.5 activation). Tenant accounts omit it.

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [owner, manager, engineer, doctor, worker, installer, reviewer]
          example: ["owner", "doctor"]
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        is_platform_staff:
          type: boolean

    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string

    RefreshResponse:
      type: object
      properties:
        access:
          type: string

    TelemetryReading:
      type: object
      properties:
        server_received_ts:
          type: string
          format: date-time
        device_ts:
          type: string
          format: date-time
        is_buffered:
          type: boolean
        buffered_delay_mins:
          type: number
          nullable: true
          description: Minutes between device_ts and server_received_ts (GENERATED column, always computed); values near 0 for non-buffered readings
        slot_id:
          type: string
          example: S01-PACK-A
        metrics:
          type: object
          description: |
            Map of metric_key -> {avg, min, max}. Keys come from sensor_metric_types catalog.
            Example: {"temp": {"avg": 28.4, "min": 27.1, "max": 29.2},
                      "co2":  {"avg": 800,  "min": 750,  "max": 850}}
            Velocity-capable metrics may include max_ts (second offset 0-59).

    MetricRange:
      type: object
      properties:
        avg:
          type: number
        min:
          type: number
        max:
          type: number

    MetricRangeMaxTs:
      allOf:
        - $ref: '#/components/schemas/MetricRange'
        - type: object
          properties:
            max_ts:
              type: integer
              description: Second offset (0-59) when max value was recorded

    AlertInstance:
      type: object
      properties:
        alert_id:
          type: string
          format: uuid
        metric_type:
          type: string
          enum: [thi, co, power_mains, power_gen, temp, humidity, nh3, lux]
        current_status:
          type: string
          enum: [ACTIVE_TIER_1, ACTIVE_TIER_2, ACTIVE_TIER_3, RESOLVED]
        current_value:
          type: number
          format: float
          nullable: true
          description: Last observed breach value at triggering; null for legacy/replay rows (Audit T3)
        source:
          type: string
          enum: [REALTIME, REPLAY_ANALYSIS]
        triggered_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        highest_tier_reached:
          type: integer

    MaintenanceMute:
      type: object
      description: >
        One planned-maintenance mute window (F11-F13, v1.7.2). While active for a
        saloon, threshold-crossing and duration-filter alerts are suppressed;
        readings still log and Tier-1 velocity always pages (Decision 10).
        `active` uses the ENGINE's predicate (starts_at ≤ now < ends_at), so a
        row reads active here exactly when it suppresses an alert.
      properties:
        mute_id:
          type: integer
          example: 12
        saloon_id:
          type: string
          description: Stringified saloon PK (contract shape)
          example: '7'
        farm_id:
          type: integer
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          example: Exhaust fan replacement
        active:
          type: boolean
        created_by:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    Province:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    City:
      type: object
      properties:
        id:
          type: integer
        province_id:
          type: integer
        name:
          type: string

    Village:
      type: object
      properties:
        id:
          type: integer
        city_id:
          type: integer
        name:
          type: string

    SaloonPosition:
      type: object
      properties:
        id:
          type: integer
        saloon_id:
          type: integer
        label:
          type: string
          description: e.g. 'North Wall', 'South Wall', 'East Wall', 'West Wall'

    SensorSlot:
      type: object
      properties:
        slot_id:
          type: string
        position_id:
          type: integer
        position_label:
          type: string
        is_active:
          type: boolean

    FarmLocationRef:
      type: object
      properties:
        province_id:
          type: integer
        province_name:
          type: string
        city_id:
          type: integer
        city_name:
          type: string
        village_id:
          type: integer
          nullable: true
        village_name:
          type: string
          nullable: true

    SaloonDetail:
      type: object
      properties:
        saloon_id:
          type: string
        name:
          type: string
        farm_id:
          type: integer
        farm_name:
          type: string
        locations:
          $ref: '#/components/schemas/FarmLocationRef'
        org_id:
          type: string
          format: uuid
        operational_state:
          type: string
          enum: [EMPTY_SANITATION, PRE_HEATING, ACTIVE_FLOCK, HARVESTED_VACANT]
        flock_age_days:
          type: integer
          nullable: true
        gateway_slot_id:
          type: string
          nullable: true
        gateway_status:
          type: string
          enum: [ONLINE, OFFLINE, null]
          nullable: true
        sensor_slots:
          type: array
          items:
            $ref: '#/components/schemas/SensorSlot'

    FarmOverviewSaloon:
      type: object
      properties:
        saloon_id:
          type: string
        name:
          type: string
        operational_state:
          type: string
        flock_age_days:
          type: integer
          nullable: true
        gateway_status:
          type: string
          nullable: true
          enum: [ONLINE, OFFLINE]
        active_alert_count:
          type: integer
        highest_active_tier:
          type: integer
          nullable: true

    # ⚠️ NOTE: FarmDetail and FarmOverview were previously duplicated.
    # Consolidated: FarmDetail now aliases FarmOverview via $ref.
    # Both schemas are identical. Use FarmOverview in all endpoint responses.
    FarmDetail:
      $ref: '#/components/schemas/FarmOverview'

    FarmOverview:
      type: object
      properties:
        farm_id:
          type: integer
        name:
          type: string
        locations:
          $ref: '#/components/schemas/FarmLocationRef'
        saloons:
          type: array
          items:
            $ref: '#/components/schemas/FarmOverviewSaloon'

    HourlyAnalyticsBucket:
      type: object
      properties:
        bucket_hr:
          type: string
          format: date-time
        avg:
          type: number
        high_variance:
          type: boolean

    HourlyAnalyticsResponse:
      type: object
      properties:
        metric:
          type: string
        slot_id:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/HourlyAnalyticsBucket'

    TelemetryResponse:
      type: object
      properties:
        saloon_id:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryReading'

    FarmTelemetryResponse:
      type: object
      properties:
        farm_id:
          type: integer
        results:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/TelemetryReading'
              - type: object
                properties:
                  saloon_id:
                    type: string
                    description: The saloon this reading came from (farm rows only).

    ActiveAlertsResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AlertInstance'

    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                connections:
                  type: integer
                max_connections:
                  type: integer
                latency_ms:
                  type: number
            redis:
              type: object
              properties:
                status:
                  type: string
                ping_ms:
                  type: number
                memory_usage_mb:
                  type: number
                queue_depth:
                  type: object
                  properties:
                    realtime:
                      type: integer
                    historical:
                      type: integer
                    pending_approval:
                      type: integer
                      description: Unapproved-gateway telemetry buffer (v1.1)
                insert_buffer_length:
                  type: integer
                  description: Rows awaiting batch flush to TimescaleDB (v1.1)
            subscriber:
              type: object
              description: Subscriber tier (v1.1 — DR T4b observability)
              properties:
                group_members:
                  type: integer
                  description: Live shared-subscription members; < 2 is a CRITICAL condition
            celery:
              type: object
              properties:
                status:
                  type: string
                active_workers:
                  type: integer
                queue_depth:
                  type: integer
            emqx:
              type: object
              properties:
                status:
                  type: string
                connected_clients:
                  type: integer
                messages_rate:
                  type: number

    ProvisioningSyncRequest:
      type: object
      required: [gateway_slot_id, saloon_assignments, sensor_slot_mappings]
      properties:
        gateway_slot_id:
          type: string
        saloon_assignments:
          type: array
          items:
            type: integer
        sensor_slot_mappings:
          type: array
          items:
            type: object
            properties:
              pack_id:
                type: string
              slot_id:
                type: string
              position_id:
                type: integer
                description: ID of the saloon_position to bind this sensor slot to
        hardware_replacements:
          type: array
          description: Optional — hardware replacements performed on-site, pending FM approval
          items:
            type: object
            properties:
              slot_id:
                type: string
                description: The logical slot being replaced (sensor or gateway)
              old_hardware_id:
                type: string
                description: Hardware serial being removed
              new_hardware_id:
                type: string
                description: New hardware serial being installed
        installer_notes:
          type: string

    LocationTreeVillage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    LocationTreeCity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        villages:
          type: array
          items:
            $ref: '#/components/schemas/LocationTreeVillage'
        farms:
          type: array
          items:
            type: object
            properties:
              farm_id:
                type: integer
              name:
                type: string

    LocationTreeProvince:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        cities:
          type: array
          items:
            $ref: '#/components/schemas/LocationTreeCity'

    TimeResponse:
      type: object
      properties:
        unix_ts:
          type: integer
          description: Current Unix timestamp in seconds (NTP fallback for gateways)

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    GatewayConfigResponse:
      type: object
      description: >
        Full gateway configuration delivered on first connection (zero-touch
        provisioning). Built by joining farms, saloons, gateway_saloon_zones,
        saloon_positions and saloon_sensor_slots. AU-fix 2026-08-16 (R2/R6
        alignment): carries org_id + farm_id (the gateway needs them for its
        topic prefix) and deliberately OMITS slot_id everywhere — the gateway
        must not persist slot mappings; it publishes bare pack_ids and the
        backend resolves them via gateway_sensor_mapping. All numeric IDs are
        integers. See design-zero-touch-provisioning.md §3.1.
      required: [gateway_slot_id, org_id, farm_id, farm, saloon_zones, mqtt_broker]
      properties:
        gateway_slot_id:
          type: string
          example: "GW-001"
        org_id:
          type: string
          format: uuid
          description: Tenant UUID — first segment of every MQTT topic the gateway publishes to
        farm_id:
          type: integer
          description: Second topic segment
        farm:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            location:
              type: object
              properties:
                province:
                  type: string
                city:
                  type: string
                village:
                  type: string
                  nullable: true
        saloon_zones:
          type: array
          items:
            type: object
            properties:
              saloon_id:
                type: integer
              name:
                type: string
              positions:
                type: array
                description: Local display/labeling info only — NO slot_id (R2)
                items:
                  type: object
                  properties:
                    position_id:
                      type: integer
                    name:
                      type: string
                    pack_id:
                      type: string
        mqtt_broker:
          type: object
          properties:
            host:
              type: string
              example: "mqtt.morghdari.com"
            port:
              type: integer
              example: 8883
            tls:
              type: boolean
              example: true

    OrgMemberInviteRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          example: new.worker@goldenegg.com
        role:
          type: string
          enum: [owner, manager, engineer, doctor, worker, installer, reviewer]

    OrgMemberOut:
      type: object
      properties:
        member_id:
          type: integer
          description: org_members.id
        user_id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [owner, manager, engineer, doctor, worker, installer, reviewer]
        is_active:
          type: boolean
        joined_at:
          type: string
          format: date-time

    ThresholdTemplate:
      type: object
      description: >-
        lifecycle_templates row — the O4 catalog shape. v1.7.1 ADDS `status`,
        `farm_id`, `created_by` and `published_at` (additive to v1.7.0): a
        client must be able to tell a DRAFT from a live template, because only
        PUBLISHED rows arm alarms.
      properties:
        template_id:
          type: integer
        org_id:
          type: integer
          nullable: true
          description: null = the shared built-in catalog row (writable by no one).
        breed_type:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        is_default:
          type: boolean
          nullable: true
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        farm_id:
          type: integer
          nullable: true
          description: Owning farm of the draft; null = org-wide.
        created_by:
          type: integer
          nullable: true
        published_at:
          type: string
          nullable: true
          description: ISO-8601 with a Z suffix; null while DRAFT.

    ThresholdTemplateRule:
      type: object
      description: One day-ranged band of a template (lifecycle_threshold_rules row).
      properties:
        id:
          type: integer
        metric_key:
          type: string
          enum: [temp, humidity, lux, nh3, co2, thi]
        template:
          type: integer
          nullable: true
        day_from:
          type: integer
          minimum: 0
          maximum: 400
        day_to:
          type: integer
          minimum: 0
          maximum: 400
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true

    ThresholdTemplateRuleInput:
      type: object
      required: [metric_key, day_from, day_to]
      properties:
        metric_key:
          type: string
          enum: [temp, humidity, lux, nh3, co2, thi]
        day_from:
          type: integer
          minimum: 0
          maximum: 400
        day_to:
          type: integer
          minimum: 0
          maximum: 400
          description: Inclusive; day_to must be >= day_from.
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
          description: An `nh3` band MUST carry a max — NH3 can never be silenced.

    ThresholdTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/ThresholdTemplate'
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: '#/components/schemas/ThresholdTemplateRule'

    SaloonTemplateAssignment:
      type: object
      description: >-
        O16 — the saloon's EXPLICIT assignment beside what it currently resolves
        to, so an ops screen can show "inheriting the breed chain" as plainly as
        "assigned to template 7".
      properties:
        saloon_id:
          type: integer
        assigned_template_id:
          type: integer
          nullable: true
        effective_template_id:
          type: integer
          nullable: true
        source:
          type: string
          enum: [assigned, org_breed, org_default, global_default, none]

paths:
  /status/:
    get:
      tags: [Monitoring]
      summary: Public status page — 14-day uptime (v0.9/B4, MET-STATUS)
      description: >
        Unauthenticated. Blackbox probe_success history only — aggregate
        booleans, zero tenant data by construction. Minimum across vantages
        is the headline (fail-closed); Prometheus unreachable yields
        `unknown`, never an error.
      responses:
        '200':
          description: Status payload (or unknown)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [operational, degraded, unknown] }
                  uptime_14d_pct: { type: number, nullable: true }
                  checked_at: { type: string }

  /auth/login/:
    post:
      tags: [Authentication]
      summary: Login and receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
        '403':
          description: >-
            MFA required — platform-staff account without a live/valid mfa_code
            (or without a confirmed enrollment). Body carries error=mfa_required
            and enrolled=false when setup has not happened yet. (v1.7.1, M7-07)

  /auth/mfa/setup/:
    post:
      tags: [Platform Support]
      summary: Issue (or re-issue) a TOTP enrollment for platform-staff MFA (v1.7.1, M7-07)
      description: >-
        Staff-NOT-superuser only. Returns the hex secret and otpauth:// URI for
        the authenticator app. Until /auth/mfa/confirm/ verifies a live code the
        enrollment stays unconfirmed and staff login is blocked (403 mfa_required).
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Pending enrollment issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_uri: { type: string }
                  confirmed: { type: boolean, example: false }
        '403':
          description: Caller lacks the support platform claim

  /auth/mfa/confirm/:
    post:
      tags: [Platform Support]
      summary: Confirm the enrollment with the first live TOTP code (v1.7.1, M7-07)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Enrollment confirmed — staff login now open
        '400':
          description: Missing/wrong code, or already confirmed
        '403':
          description: Caller lacks the support platform claim

  /auth/token/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Invalid or expired refresh token

  /saloons/:
    get:
      tags: [Saloon]
      summary: List saloons with full detail (v1.6 native lists — Tracker §4o gap-fill)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: farm_id
          in: query
          required: false
          description: Filter to one farm; a foreign or unknown farm is the same 403 (no existence oracle).
          schema:
            type: integer
      responses:
        '200':
          description: SaloonDetail list (the caller's org saloons, farm + id order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaloonDetail'
        '403':
          description: Foreign farm requested

  /saloons/{saloon_id}/:
    get:
      tags: [Saloon]
      summary: Get saloon detail with sensor slot info
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Saloon details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonDetail'
        '403':
          description: Forbidden — user not in the target org
        '404':
          description: Saloon not found

  /saloons/{saloon_id}/telemetry/:
    get:
      tags: [Telemetry]
      summary: Get telemetry readings (gap-fill or historical)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema:
            type: integer
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: slot_id
          in: query
          required: false
          schema:
            type: string
        - name: include_buffered
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: 'M7-12: paging window — paging mode returns NEWEST-FIRST rows (?limit=1 is the latest reading). Max 1000.'
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          description: 'M7-12: skip the newest N rows in paging mode.'
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Telemetry readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryResponse'

  /saloons/{saloon_id}/alerts/:
    get:
      tags: [Alerts]
      summary: Get active or historical alerts for a saloon
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, ALL]
            default: ACTIVE
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [REALTIME, REPLAY_ANALYSIS]
      responses:
        '200':
          description: Alert instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveAlertsResponse'

  /saloons/{saloon_id}/analytics/hourly/:
    get:
      tags: [Analytics]
      summary: Get hourly aggregated analytics for charts
      description: |
        Queries metric_hourly_aggregates (built by Celery scheduled task).
        metric param accepts any metric_key from sensor_metric_types catalog.
        New sensor types (CO2, noise, pressure) work automatically.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: metric
          in: query
          required: true
          schema:
            type: string
            description: Any metric_key from sensor_metric_types (e.g., temp, humidity, lux, nh3, co2)
        - name: slot_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Hourly analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyAnalyticsResponse'

  /farms/:
    get:
      tags: [Farms]
      summary: List farms with saloon cards (v1.6 native lists — Tracker §4o gap-fill)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: org_id
          in: query
          required: false
          description: Must equal the caller's org claim; a foreign org is a 403, never an empty list.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: FarmOverview list (all farms of the caller's org, id order)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FarmOverview'
        '403':
          description: Foreign org requested

  /farms/{farm_id}/overview/:
    get:
      tags: [Farms]
      summary: Get farm dashboard overview with saloon cards
      security: [{ BearerAuth: [] }]
      parameters:
        - name: farm_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Farm overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOverview'

  /farms/{farm_id}/telemetry/:
    get:
      tags: [Telemetry]
      summary: Farm-wide telemetry — the saloon streams merged (v1.6 native — Tracker §4o gap-fill)
      description: >
        One TelemetryReading list across ALL the farm's saloons (rows gain
        saloon_id); the farm list equals the union of the per-saloon lists for
        the same window. Paging (?limit=/?offset=) is newest-first (?limit=1 is
        the latest reading); without paging the list is chronological ascending.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: farm_id
          in: path
          required: true
          schema:
            type: integer
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: slot_id
          in: query
          required: false
          schema:
            type: string
        - name: include_buffered
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Newest-first paging window (?limit=1 is the latest reading). Max 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: offset
          in: query
          required: false
          description: Skip the newest N rows in paging mode.
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Farm telemetry readings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmTelemetryResponse'
        '404':
          description: Farm not found

  /provisioning/location-tree/:
    get:
      tags: [Provisioning]
      summary: Get the full location hierarchy for the installer tree panel
      description: |
        Returns all provinces. The installer drills down: province → cities → villages → farms.
        Each level scopes the next. This endpoint is cached server-side for 1 hour.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Location tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationTreeProvince'

  /provisioning/provinces/:
    get:
      tags: [Provisioning]
      summary: List all provinces
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Province list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Province'

  /provisioning/cities/:
    get:
      tags: [Provisioning]
      summary: List cities in a province
      security: [{ BearerAuth: [] }]
      parameters:
        - name: province_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: City list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'

  /provisioning/villages/:
    get:
      tags: [Provisioning]
      summary: List villages in a city
      security: [{ BearerAuth: [] }]
      parameters:
        - name: city_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Village list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Village'

  /provisioning/saloons/{saloon_id}/positions/:
    get:
      tags: [Provisioning]
      summary: List sensor positions in a saloon
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Position list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaloonPosition'

  /provisioning/sync/:
    post:
      tags: [Provisioning]
      summary: Sync offline installer data (PWA)
      description: >
        AU-fix 2026-08-16: callers MUST hold the `installer` role for the
        target org (scope-checked via account_role_scopes) — this endpoint
        atomically rewrites provisioning topology (zones, sensor mappings,
        hardware replacements) and flips provisioning_status.
        Server derives gateway_hardware_id from the ACTIVE
        gateway_hardware_registry row of the gateway slot (the request carries
        only pack_id/slot_id/position_id) and upserts gateway_sensor_mapping.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisioningSyncRequest'
      responses:
        '200':
          description: Sync accepted, provisioning status → PENDING_APPROVAL (FM review pending)
        '400':
          description: Invalid payload — missing required fields
        '403':
          description: Caller does not hold the installer role for the target org (AU-fix 2026-08-16)
        '409':
          description: |
            Concurrent sync already in progress for this gateway_slot_id
            (per-slot Redis lock, Blueprint §6 / AU-RACES closed 2026-08-23).
            Retry after the Retry-After interval (seconds). No partial topology is written.

  /provisioning/gateways/{gateway_slot_id}/approve/:
    post:
      tags: [Provisioning]
      summary: Farm Manager approves a pending gateway (v1.1)
      description: >
        Requires the manager role for the target org (R3-fix 2026-08-16: this gate
        was the heart of D18/R3 but had no endpoint). Writes provisioning_audit_log,
        flips status PENDING_APPROVAL → PROVISIONED, deletes the
        gateway:status:{slot} cache key in the same transaction, and dispatches
        provisioning.drain_pending_approval to move buffered telemetry into the
        real-time pipeline.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gateway_slot_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200':
          description: Approved — status PROVISIONED, pending telemetry draining
        '403':
          description: Caller is not a Farm Manager for the target org
        '404':
          description: Gateway slot not found or not in PENDING_APPROVAL

  /provisioning/gateways/{gateway_slot_id}/reject/:
    post:
      tags: [Provisioning]
      summary: Farm Manager rejects a pending gateway (v1.1)
      description: >
        Status → REJECTED (terminal). Buffered telemetry:pending_approval entries for
        this gateway are discarded (optionally archived). Requires the manager role.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gateway_slot_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Rejected — pending buffer discarded
        '403':
          description: Caller is not a Farm Manager for the target org
        '404':
          description: Gateway slot not found

  /alerts/{alert_id}/acknowledge/:
    post:
      tags: [Alerts]
      summary: Normal Worker acknowledges a Tier 1 alert — pauses escalation (v1.1)
      description: >
        Writes alert_acknowledgements AND the alert:paused:{alert_id} Redis key in
        one transaction (TTL = pause window, default 10 min from
        system_configuration.alert_acknowledgement_pause_minutes).
        The acknowledgement row carries org_id derived server-side from the JWT
        org claim (C-10, 2026-08-24) — never taken from client input.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: alert_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200':
          description: Acknowledged — escalation paused for the configured window
        '403':
          description: Caller is not an assigned worker/engineer for the saloon

  /saloons/{saloon_id}/operational-state/:
    post:
      tags: [Saloon]
      summary: Transition saloon operational state (v1.1)
      description: >
        Requires engineer+ role. Writes saloon_operational_states (history row,
        closes the previous one). ACTIVE_FLOCK is blocked/warned when temp is
        outside ±active_flock_temp_tolerance_c of the pre-heat target (Audit A6).
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [EMPTY_SANITATION, PRE_HEATING, ACTIVE_FLOCK, HARVESTED_VACANT]
                reason: { type: string }
      responses:
        '200':
          description: State transitioned
        '400':
          description: Invalid transition or temperature tolerance violated (ACTIVE_FLOCK guard)
        '403':
          description: Caller lacks the engineer role for this saloon

  /saloons/{saloon_id}/flocks/:
    get:
      tags: [Saloon]
      summary: List flock cycles for a saloon (v1.1)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Flock cycles (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    flock_id: { type: integer }
                    breed_type: { type: string }
                    start_date: { type: string, format: date }
                    end_date: { type: string, format: date, nullable: true }
    post:
      tags: [Saloon]
      summary: Register a flock cycle (starts dynamic threshold alerting) (v1.1)
      description: Requires engineer+ role. end_date IS NULL = active flock; triggers cache_saloon_thresholds immediately.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: saloon_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [breed_type, start_date, placement_count]
              properties:
                breed_type: { type: string }
                start_date: { type: string, format: date }
                placement_count:
                  type: integer
                  minimum: 1
                  description: Chicks placed at flock start — the mortality-% denominator (NOT NULL in database.md; required since contract v1.4.2)
                day_old_weight_g:
                  type: number
                  description: Optional FCR baseline; NULL is treated as 0 (documented ~1.6% approximation)
      responses:
        '201':
          description: Flock cycle created
        '400':
          description: An active flock (end_date IS NULL) already exists for this saloon

  /gateway-requests/:
    get:
      tags: [Provisioning]
      summary: List gateway requests for the caller's org (v1.1)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Gateway requests
    post:
      tags: [Provisioning]
      summary: Submit a gateway request (provisioning Step 0) (v1.1)
      description: >
        Requires manager+ role. Capped by system_configuration.max_pending_gateway_requests
        per org. On platform approval the system creates the gateway_slot + MQTT credentials.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_id, quantity]
              properties:
                farm_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
                details: { type: string }
      responses:
        '201':
          description: Request created (status PENDING)
        '400':
          description: Pending-request cap exceeded (max_pending_gateway_requests)
        '403':
          description: Caller lacks the manager role

  /gateway-requests/{request_id}/review/:
    post:
      tags: [Provisioning]
      summary: Approve or reject a gateway request (v1.1)
      description: >
        Platform side ONLY (GS-BOARD decision 2026-08-22): System Admin or Platform
        Support (support claim) by default; the reviewer set is extensible via a
        platform-side permission granted to future roles. No org-board role exists.
        On approval the gateway_slot is created with DEFAULT PENDING_INSTALLATION
        and MQTT credentials issued.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string }
      responses:
        '200':
          description: Decision recorded; on APPROVED the slot + credentials exist
        '403':
          description: Caller cannot review requests

  /metric-types/:
    get:
      tags: [System]
      summary: List all known sensor metric types (catalog for dynamic frontend tiles)
      description: |
        Returns all rows from sensor_metric_types table.
        Frontend uses this to render dynamic metric tiles — no hardcoded metric names.
        When a new sensor type (CO2, noise) is added, this endpoint auto-returns it.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Metric type catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    metric_key:
                      type: string
                    display_name:
                      type: string
                    unit:
                      type: string
                    value_type:
                      type: string
                    is_tier1:
                      type: boolean
                    icon_name:
                      type: string
                      nullable: true

  /gateways/{gateway_slot_id}/config/:
    get:
      tags: [Hardware]
      summary: Zero-touch provisioning — gateway fetches its full configuration
      description: >
        Authenticated with the gateway's MQTT credentials (Basic auth:
        username = gateway_slot_id, password = MQTT credential, validated
        against mqtt_device_credentials). The gateway calls this on first
        boot (and re-fetches every 24h or on MQTT command). Returns farm
        location, saloon zones with sensor bindings, and MQTT broker
        settings. 403 if provisioning_status is REJECTED or otherwise not
        PENDING_INSTALLATION / PENDING_APPROVAL / PROVISIONED.
        See design-zero-touch-provisioning.md (Reconciliation R6, 2026-08-16).
      security:
        - GatewayBasicAuth: []
      parameters:
        - name: gateway_slot_id
          in: path
          required: true
          schema:
            type: string
          example: "GW-001"
      responses:
        '200':
          description: Gateway configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayConfigResponse'
        '401':
          description: Invalid or expired credentials
        '403':
          description: Gateway status is REJECTED or SUSPENDED
        '404':
          description: Gateway slot does not exist
        '429':
          description: Rate limited (nginx gateway_config zone, 1 r/s per IP — brute-force guard, AU-fix 2026-08-16)

  /health/:
    get:
      tags: [System]
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: Service degraded

  /metrics/:
    get:
      tags: [System]
      summary: Prometheus scrape endpoint (Observability Runbook §3.1)
      description: >-
        Prometheus exposition format (text/plain). Scraped by the monitoring
        stack directly on the internal network (daphne:8000); nginx returns
        404 for it publicly. Worker-side counters/latencies are bridged via
        Redis and refreshed at scrape time.
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string

  /hardware/time/:
    get:
      tags: [Hardware]
      summary: NTP fallback — return current server time
      responses:
        '200':
          description: Current server timestamp
          content:
            application/json:
              schema:
                type: object
                properties:
                  unix_ts:
                    type: integer
                    example: 1700000000

  /platform/support/session/:
    post:
      tags: [Platform Support]
      summary: Open an audited org-context session (v1.2 — GS-fix 2026-08-22)
      description: >
        Requires the `support` platform claim (is_platform_staff AND NOT superuser).
        Body MUST carry a non-empty incident_id — the audit accountability anchor.
        On success returns a 15-minute scoped access token whose claims add org_id,
        support_session: true, and the incident ID. While that token is used, standard
        tenant middleware + RLS scope every request to exactly that org (Security §4.5);
        the support engineer never gets BYPASSRLS. Every open writes an
        account_activity_logs row (action=SUPPORT_ORG_ENTER, details={incident_id, reason}).
        Role defined at v0.2; activated at v0.7 with mandatory platform-staff MFA.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id, incident_id]
              properties:
                org_id: { type: string, format: uuid }
                incident_id: { type: string, minLength: 1 }
                reason: { type: string }
      responses:
        '200':
          description: Session opened — scoped token issued (expires in 15 min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  org_id: { type: string, format: uuid }
                  incident_id: { type: string }
                  expires_in_sec: { type: integer, example: 900 }
        '400':
          description: Missing or empty incident_id
        '403':
          description: Caller lacks the support platform claim

  /platform/support/gateways/{gateway_slot_id}/provisioning/:
    post:
      tags: [Platform Support]
      summary: Suspend or resume a gateway (whitelisted op, v1.2)
      description: >
        Requires an ACTIVE support session for the gateway's org. action=suspend flips
        provisioning_status to SUSPENDED (EMQX ACL then rejects the gateway);
        action=resume restores the prior status. Writes a SUPPORT_OP_* audit row with
        the session's incident_id. Runbook-gated.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: gateway_slot_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend, resume] }
                reason: { type: string }
      responses:
        '200':
          description: Status flipped; audit row written
        '403':
          description: No active support session for this org, or caller lacks support claim
        '404':
          description: Gateway slot not found in the session org

  /platform/support/alerts/{alert_id}/force-resolve/:
    post:
      tags: [Platform Support]
      summary: Force-resolve a stuck alert (whitelisted op, v1.2)
      description: >
        Requires an ACTIVE support session for the alert's org. Sets resolved_at and
        writes a SUPPORT_OP_* audit row with the incident_id. Use only for alerts stuck
        by a known engine defect (runbook); normal resolution is hysteresis-driven.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: alert_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Alert resolved; audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Alert not found (or already resolved → idempotent 200)

  /platform/support/hardware/gateways/:
    post:
      tags: [Platform Support]
      summary: Register a gateway hardware unit onto a slot (v0.9 H0)
      description: >
        Hardware Team write path: creates the gateway_hardware_registry row the
        installer sync requires. Requires an ACTIVE support session for the
        slot's org; writes SUPPORT_OP_HW_REGISTER with the incident_id.
        Idempotent on the identical active row; 409 when the slot already
        carries a different live unit (retire it first).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id, hardware_id, reason]
              properties:
                slot_id: { type: string }
                hardware_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Unit registered (or already active → idempotent); audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Slot not found in the session org
        '409':
          description: Slot already has different live hardware

  /platform/support/hardware/gateways/{hw_id}/retire/:
    post:
      tags: [Platform Support]
      summary: Retire a gateway hardware unit (v0.9 H0)
      description: >
        Closes the registry row (removed_at/removed_by); idempotent on an
        already-retired row. Writes SUPPORT_OP_HW_RETIRE with the incident_id.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: hw_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Unit retired; audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Hardware row not found in the session org

  /platform/support/hardware/sensors/:
    post:
      tags: [Platform Support]
      summary: Register a sensor hardware unit onto a slot (v0.9 H1)
      description: >
        Hardware Team write path for sensor packs (hardware_registry). Same
        register semantics as the gateway kind; session-scoped + audited.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id, hardware_id, reason]
              properties:
                slot_id: { type: string }
                hardware_id: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Unit registered (or already active → idempotent); audit row written
        '403':
          description: No active support session for this org
        '404':
          description: Slot not found in the session org
        '409':
          description: Slot already has different live hardware

  /platform/support/hardware/sensors/{hw_id}/retire/:
    post:
      tags: [Platform Support]
      summary: Retire a sensor hardware unit (v0.9 H1)
      description: >

                        frequency: { type: string, nullable: true }
        '400': { description: Bad date format, or several reports share the saloon+day }
        '404': { description: No report for this saloon+day }

  /reports/{report_id}/:
    patch:
      tags: [Daily Reports]
      summary: Edit a daily report — same calendar day only (v1.5 — Tracker §4n; merged inputs v1.7.0 — Tracker §4s)
      description: >

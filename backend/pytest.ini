[pytest]
# فارسی: پیکربندی pytest — قراردادهای django-tdd طبق Blueprint §7.
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
addopts =
    --reuse-db
    --nomigrations
    --cov=apps
    --cov-report=term-missing
    --cov-report=json:coverage.json
    --cov-fail-under=80
    --strict-markers
markers =
    # The RLS EXCEPTION to --nomigrations (Blueprint §7): row-level-security
    # policies are created by MIGRATIONS, so under --nomigrations they never
    # exist and cross-org tests would pass VACUOUSLY. Tests marked
    # use_migrations run with migrations enabled instead.
    use_migrations: run with real migrations (RLS tests only)
    # Implemented in tests/conftest.py (django_db_setup override materializes
    # the migration-only SQL artifacts — reports tables — on a fresh test DB;
    # see the F2 note there). A no-op marker lets COLD gates pass vacuously.

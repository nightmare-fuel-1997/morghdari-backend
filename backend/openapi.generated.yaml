      - in: path
        name: saloon_id
        schema:
          type: integer
        required: true
      tags:
      - Farms & Saloons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSaloonUpdateRequestRequest'
            examples:
              Rename:
                value:
                  name: Saloon 1 (east)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSaloonUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSaloonUpdateRequestRequest'

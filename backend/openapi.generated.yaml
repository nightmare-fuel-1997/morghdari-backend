  /api/v1/saloons/{saloon_id}/telemetry/:
    get:
      operationId: list_saloon_telemetry
      description: |-
        Readings for ONE saloon (contract v1.4.4 shape, byte-stable).

        Default ordering is chronological ascending and returns the whole retained
        window; passing `limit` or `offset` switches to **newest-first paging** — the
        Flutter chart calls `?limit=24` and `?limit=1` is exactly the latest reading.
        `limit` must be 1–1000 and `offset` ≥ 0; both are 400 on violation.

        `since`/`until` (ISO datetimes) bound `device_ts`; an unparseable value is
        IGNORED, not a 400 (v1.4.4 semantics). Buffered rows are excluded unless
        `include_buffered` is truthy. Rows are org-scoped from the claim.
      summary: Saloon telemetry readings
      parameters:
      - in: query
        name: include_buffered
        schema:
          type: boolean
        description: Include gateway-buffered (replayed) rows; default false.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size (1–1000). Giving `limit` or `offset` switches the list
          to NEWEST-FIRST, so `limit=1` is the latest reading.
      - in: query
        name: offset
        schema:
          type: integer
        description: Page start offset (≥ 0) within the newest-first ordering.
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      - in: query
        name: since
        schema:
          type: string
        description: ISO datetime lower bound on device_ts; unparseable values are
          ignored.
      - in: query
        name: slot_id
        schema:
          type: string
        description: Restrict to one gateway slot's readings.
      - in: query
        name: until
        schema:
          type: string
        description: ISO datetime upper bound on device_ts; unparseable values are
          ignored.
      tags:
      - Telemetry
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonTelemetryResponse'
              examples:
                OneReading:
                  value:
                    server_received_ts: '2026-09-04T19:42:07+00:00'
                    device_ts: '2026-09-04T19:42:00+00:00'
                    is_buffered: false
                    buffered_delay_mins: null
                    slot_id: 3f7c9e2a-1b4d-4e6f-8a2c-5d7f9b3e6a1c
                    metrics:
                      temp:
                        avg: 24.5
                        min: 23.9
                        max: 25.1
                      nh3:
                        avg: 12.0
                  summary: One reading
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.

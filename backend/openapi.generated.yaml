            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/v1/saloons/{saloon_id}/operational-state/:
    post:
      operationId: transition_operational_state
      description: |-
        Moves the saloon one step along the canonical loop
        (`EMPTY_SANITATION → PRE_HEATING → ACTIVE_FLOCK → HARVESTED_VACANT → …`) and
        closes the previous state row in the same transaction. **Engineer+** only.

        Verdicts: 400 for an unknown state, a no-op (already in that state) or an
        illegal jump — the loop is strictly one step forward; 403 for a missing role.

        The A6 guard: entering `ACTIVE_FLOCK` also requires the latest saloon
        temperature to sit within ±`active_flock_temp_tolerance_c` of the cached
        `preheat_target_c`, otherwise the transition is a 400 with the measured
        distance in the message. With no cached target, no reading, or Redis down the
        guard degrades to *allow* — never to a 500.
      summary: Transition the saloon's operational state
      parameters:
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      tags:
      - Farms & Saloons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationalStateRequestRequest'
            examples:
              StartPre-heating:
                value:
                  state: PRE_HEATING
                  reason: New flock arrives tomorrow
                summary: Start pre-heating
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperationalStateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperationalStateRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalStateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range

  /api/v1/gateway-requests/{request_id}/review/:
    post:
      operationId: review_gateway_request
      description: |-
        Platform review permission required (superuser, `admin`/`support` staff
        role, or the `gateway_review` platform permission). The row is locked
        (`select_for_update`) for the whole decision, so two reviewers cannot both win.

        **REJECT** writes the reason (default `rejected`) and returns the request row.
        **APPROVE** mints a `GatewaySlot` (supplied `slot_id` or a generated `GW-…`),
        a bcrypt MQTT credential, publish-only EMQX allow rules for the gateway's own
        `telemetry`/`status` topics, and registers the broker authn user — then returns
        the request plus `gateway_slot_id`, `username` and the **one-time plaintext
        `password`**. A broker hiccup never fails the review (FNV-soft; the next
        rotation heals it).

        Verdicts: 404 unknown request; **409** `request already reviewed` when the row
        is no longer PENDING; 400 for a decision other than APPROVE/REJECT. Approving a
        slot id that already exists is a 409 from the unique constraint.
      summary: Approve or reject a gateway request
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        description: Gateway request id.
        required: true
      tags:
      - Provisioning & Gateways
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayReviewRequestRequest'
            examples:
              Approve:
                value:
                  decision: APPROVE
                  slot_id: GW-0041
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GatewayReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GatewayReviewRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayReviewApproved'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict — state precondition failed (e.g. concurrent sync
            lock, wrong flock state).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:

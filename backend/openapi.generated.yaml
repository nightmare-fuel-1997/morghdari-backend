  /api/v1/saloons/{saloon_id}/flocks/{flock_id}/feed-intake/:
    get:
      operationId: list_feed_intake
      description: |-
        Chronological bare list, **one row per flock per day**. Rows carry
        `source` (`manual` for entries made here; the device lane later adds
        `device` rows) and the consumed kilograms (`feed_kg`).
      summary: List daily feed intake for a flock
      parameters:
      - in: path
        name: flock_id
        schema:
          type: integer
        description: Flock cycle id inside that saloon.
        required: true
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      tags:
      - Alerts & KPI
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedIntakeEntry'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
    post:
      operationId: upsert_feed_intake
      description: |-
        Engineer+ for the saloon. ONE row per flock per day: re-posting the
        same `entry_date` **updates** the row and audits the correction
        (`feed_intake_correction` activity log with old/new values, D22). The
        response's `corrected` flag says which branch ran — `false` on insert,
        `true` on the audited UPDATE.
      summary: Record (or correct) a day's feed intake
      parameters:
      - in: path
        name: flock_id
        schema:
          type: integer
        description: Flock cycle id inside that saloon.
        required: true
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      tags:
      - Alerts & KPI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedIntakeUpsertRequestRequest'
            examples:
              UpsertFeedIntake:
                value:
                  entry_date: '2026-08-18'
                  feed_kg: 125.5

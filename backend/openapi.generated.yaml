      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Window start, calendar day `YYYY-MM-DD` (inclusive).
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - DRAFT
          - FLAGGED
          - REJECTED
          - SUBMITTED
        description: Filter to one exact status.
      - in: query
        name: to
        schema:
          type: string
        description: Window end, calendar day `YYYY-MM-DD` (inclusive).
      tags:
      - Reports
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportListItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:

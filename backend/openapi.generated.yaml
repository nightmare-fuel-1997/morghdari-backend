  /api/v1/auth/sessions/{session_id}/:
    delete:
      operationId: revoke_my_session
      description: |-
        Revokes the refresh line (the next refresh on that `jti` is refused; the
        access token still lives out its 15 minutes).

        The session must belong to the caller: a foreign **and** a missing id answer
        an identical 404 — never an existence oracle (spec §4). Success is
        `{"status": "revoked", "id": …}`.
      summary: O12 — revoke one of my sessions
      parameters:
      - in: path
        name: session_id
        schema:
          type: integer
        description: The caller's session id (O11).
        required: true
      tags:
      - Ops
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/v1/auth/token/refresh/:
    post:
      operationId: refresh_token
      description: |-
        Stock SimpleJWT endpoint with ONE deliberate override: the tenancy
        claims are **re-derived from current DB truth** when the new access is minted,
        so a deactivated member's next refresh yields an org-less token (C-14
        fail-closed-empty) instead of copying the old org for up to 7 days.

        The response stays stock — `{access}` only; the login/refresh key asymmetry is
        contractual and must not be "unified". A refresh line revoked via O12 dies
        here with **401** `session revoked`; `sid` on the new access points at exactly
        this refresh line, and `last_seen_at` is bumped (never un-revoking).
      summary: Refresh the access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid/expired refresh token, or a session revoked via O12.

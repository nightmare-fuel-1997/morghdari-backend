        Geography is deliberately immutable here: moving a farm between provinces
        re-homes every scope row and every regional rollup, so it is a migration, not a
        rename. A foreign or unknown id is a 404; a farm outside the caller's scope
        rows is a 403. Writes a `FARM_UPDATED` audit row in the same transaction and
        returns the farm's `FarmOverview`.
      summary: F2 — rename a farm (owner)
      parameters:
      - in: path
        name: farm_id
        schema:
          type: integer
        description: Farm id (caller's org).
        required: true
      tags:
      - Farms & Saloons
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFarmUpdateRequestRequest'
            examples:
              Rename:
                value:
                  name: Farm A (north)
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFarmUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFarmUpdateRequestRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmOverview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
    delete:
      operationId: delete_farm
      description: |-
        Hard delete, **only while the farm has no saloons** — the RESTRICT
        philosophy, never a cascade. A farm that still owns a saloon is a
        `409 {"error": "farm not empty"}`; one that is still referenced by history
        (alert instances, command logs) is a 409 with the relation named, never a 500.

        The `legacy_slug_map` rows are left in place: an id is never re-issued, so the
        alias stays pointed at a farm that no longer exists — deleting it would only
        make an old alias look like a typo. Writes a `FARM_DELETED` audit row in the
        same transaction.
      summary: F3 — delete an empty farm (owner)
      parameters:
      - in: path
        name: farm_id
        schema:
          type: integer
        required: true
      tags:
      - Farms & Saloons
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FarmDeleteResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict — state precondition failed (e.g. concurrent sync
            lock, wrong flock state).

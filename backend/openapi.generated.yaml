  /api/v1/saloons/{saloon_id}/kpis/:
    get:
      operationId: get_saloon_kpis
      description: |-
        Per-request KPI bundle — nothing is materialized in v1. The
        `from`/`to` window applies to the **daily** series (mortality days,
        compliance hours); cumulative metrics stay cumulative by definition.

        (`flock_id` wins; otherwise the active flock, else the most recent one.)

        Metrics are opt-in and repeatable via `metrics=` (CSV of
        `mortality_pct,compliance_pct,fcr,cycle_summary`, default all four); an
        unknown name is a 400 — a typo must not silently produce an empty chart.

        Honesty rule: `fcr` stays **null** until BOTH a weight sample and feed data
        exist for the flock — it is never reported as 0, and `compliance_pct` counts
        only hours that actually have banded readings.
      summary: Compute saloon KPIs (D22)
      parameters:
      - in: query
        name: flock_id
        schema:
          type: integer
        description: Explicit flock cycle; defaults to the active flock, else the
          most recent.
      - in: query
        name: from
        schema:
          type: string
        description: Daily-series window start, `YYYY-MM-DD` (inclusive).
      - in: query
        name: metrics
        schema:
          type: string
        description: 'CSV subset of mortality_pct,compliance_pct,fcr,cycle_summary
          (default: all).'
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      - in: query
        name: to
        schema:
          type: string
        description: Daily-series window end, `YYYY-MM-DD` (inclusive).
      tags:
      - Alerts & KPI
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonKpisResponse'
              examples:
                KPIBundle:
                  value:
                    flock_id: 34
                    mortality_pct: 2.35
                    daily_mortality_pct:
                    - date: '2026-08-17'
                      pct: 0.12
                    - date: '2026-08-18'
                      pct: 0.08
                    compliance_pct: 91.4
                    fcr: 1.62
                    cycle_summary:
                      days_elapsed: 24
                      cumulative_mortality_pct: 2.35
                      latest_fcr: 1.62
                      alert_count: 3
                      compliance_pct: 91.4
                  summary: KPI bundle
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':

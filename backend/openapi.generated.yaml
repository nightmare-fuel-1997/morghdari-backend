      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSessionResponse'
              examples:
                ScopedSessionToken:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    org_id: 1f0c3a54-6f2b-4c9d-9d5e-2b7f4a1c8e30
                    incident_id: INC-2041
                    expires_in_sec: 900
                  summary: Scoped session token
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

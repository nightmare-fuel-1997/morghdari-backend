          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
    delete:
      operationId: delete_saloon
      description: |-
        Hard delete, only while the saloon has **no flock history and no
        telemetry history** — the schema's rule, which is stricter than the spec's
        "no active flock": `flock_cycles.saloon` is `ON DELETE RESTRICT`, so a saloon
        that EVER housed a flock (closed ones included) can never be hard-deleted. Each
        verdict kills a distinct illusion, and all of them protect the same thing — the
        saloon id that telemetry, alerts, reports and flock cycles key off.

        Verdicts: 409 `saloon has an active flock` (close it), 409 `saloon has flock
        history` (the row IS the history, and `farms_saloons` has no soft-delete column),
        409 `saloon has telemetry history` (it was measured), or 409 naming the
        still-referencing relation (positions, sensor slots, gateway bindings). The
        compat slug row is left in place — ids are never re-issued. Writes a
        `SALOON_DELETED` audit row in the same transaction, and only after the delete
        actually succeeded.
      summary: F6 — delete an empty saloon (manager+)
      parameters:
      - in: path
        name: saloon_id
        schema:
          type: integer
        required: true
      tags:
      - Farms & Saloons
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaloonDeleteResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict — state precondition failed (e.g. concurrent sync
            lock, wrong flock state).
  /api/v1/saloons/{saloon_id}/alerts/:

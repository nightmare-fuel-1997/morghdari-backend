  /api/v1/saloons/{saloon_id}/analytics/hourly/:
    get:
      operationId: get_saloon_hourly_analytics
      description: |-
        Chart-ready hourly series from `metric_hourly_aggregates` (built by the
        Celery aggregation task).

        `from`, `to` and `metric` are REQUIRED: missing → 400, `from >= to` → 400, and
        a `metric` outside the sensor catalog → 400 (`unknown metric_key`) — a typo is
        a typo, never an empty chart.

        With `slot_id` the series is that slot's own buckets; without it the buckets
        are merged saloon-wide (sample-count-weighted average, `high_variance` OR-ed
        per bucket) and `slot_id` echoes `""`. `avg` is null for an empty bucket.
      summary: Hourly aggregated readings for charts
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: ISO datetime window start (exclusive lower bound on bucket_hr).
        required: true
      - in: query
        name: metric
        schema:
          type: string
        description: Metric key; must exist in the sensor catalog.
        required: true
      - in: path
        name: saloon_id
        schema:
          type: integer
        description: Saloon id (caller's org).
        required: true
      - in: query
        name: slot_id
        schema:
          type: string
        description: One slot's buckets; omitted merges the whole saloon.
      - in: query
        name: to
        schema:
          type: string
        description: ISO datetime window end; must be strictly after `from`.
        required: true
      tags:
      - Telemetry
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HourlyAnalyticsResponse'
              examples:
                HourlyTempSeries:
                  value:
                    metric: temp
                    slot_id: ''
                    results:
                    - bucket_hr: '2026-09-04T19:00:00+00:00'
                      avg: 24.52
                      high_variance: false
                    - bucket_hr: '2026-09-04T20:00:00+00:00'
                      avg: 24.61
                      high_variance: true
                  summary: Hourly temp series
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
  /api/v1/saloons/{saloon_id}/capabilities/:

openapi: 3.0.3
info:
  title: Morghdari Poultry Monitoring API
  version: 1.7.2
  description: |-
    REST API for the Morghdari multi-tenant poultry monitoring platform. Contract v1.7.2 (ops wave + merged daily-report schemas + the threshold-template write surface O13–O16 + the follow-through core: tenant topology writes F1–F8, flock close F14, direct mortality entry F15, org alert feed F9, home rollup F10, maintenance-mute windows F11–F13, member role change, and the ratified manager-side gateway lifecycle twins).

    Authentication: Bearer JWT (15-min access token, 7-day refresh token; rotation is intentionally OFF — deactivated members fail closed via org-claim re-derivation). Gateway devices use HTTP Basic (username = gateway_slot_id) on the config endpoint only.

    Tenancy: every response is scoped to the caller's org_id claim; cross-org ids answer 404 (never distinguished from unknown ids). Roles: owner > manager > engineer > doctor/worker/installer; reviewer is read-only on daily reports.

    Base URL: https://api.morghdari.com/api/v1/ — the canonical human-written contract is backend/openapi.yaml (the implemented == contract gate); this page is its generated mirror.
  contact:
    name: Morghdari Platform Team
  license:
    name: Proprietary — Morghdari
paths:
  /api/compat/v1/farms/{farmSlug}/reports/:
    get:
      operationId: compat_farm_report_list
      description: |-
        Farm-level dashboard queue: every saloon of the farm, same window
        validation and bare merged list as W1.

        `?status=incomplete` narrows to DRAFT+SUBMITTED (the Flutter queue); any other
        value is passed through as one exact status, so native enum values keep working
        unchanged. Unknown/foreign farm slug → 404 `{"error": "not found"}`.
      summary: W5 — farm-wide report queue (legacy slug)
      parameters:
      - in: path
        name: farmSlug
        schema:
          type: string
        description: Legacy farm slug (legacy_slug_map).
        required: true
      - in: query
        name: from
        schema:
          type: string
        description: Window start, calendar day `YYYY-MM-DD` (inclusive).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - DRAFT
          - FLAGGED
          - REJECTED
          - SUBMITTED
          - incomplete
        description: '`incomplete` = DRAFT+SUBMITTED; otherwise one exact status.'
      - in: query
        name: to
        schema:
          type: string
        description: Window end, calendar day `YYYY-MM-DD` (inclusive).
      tags:
      - Compat
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompatReportListItem'
              examples:
                MergedReportList:
                  value:
                  - - id: 44
                      report_date: '2026-09-04'
                      mortality_count: 3
                      feed_kg: 125.5
                      water_l: 210.0
                      avg_weight_g: 1850.0
                      status: SUBMITTED
                      bird_count: 5000
                      avg_temperature_c: 24.5
                      avg_humidity_pct: 60.0
                      ventilation_status: STABLE
                      health_status: NORMAL
                      checklist:
                        feed: true
                        water: true
                        device: true
                      is_completed: false
                  summary: Merged report list
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/compat/v1/farms/{farmSlug}/salons/{salonSlug}/reports/:
    get:
      operationId: compat_report_list
      description: |-
        Flutter calendar/history list, delegated verbatim to the canonical
        `GET /api/v1/saloons/{saloon_id}/reports/`: same window semantics, same
        **bare merged list** (no `{results, count}` envelope).

        Slugs resolve through `legacy_slug_map`; a miss, a foreign org, or a
        farm/salon disagreement is always a 404 with `{"error": "not found"}` —
        never a 400 oracle. `from`/`to` are `YYYY-MM-DD`; unparseable is a 400 and
        `from > to` is `400 invalid time window`.

        The one compat-only filter: `?status=incomplete` answers DRAFT+SUBMITTED (the
        Flutter dashboard queue), while every other value keeps the canonical
        single-status semantics.
      summary: W1 — saloon report list (legacy slugs)
      parameters:
      - in: path
        name: farmSlug
        schema:
          type: string
        description: Legacy farm slug (legacy_slug_map).
        required: true
      - in: query
        name: from
        schema:
          type: string
        description: Window start, calendar day `YYYY-MM-DD` (inclusive).
      - in: path
        name: salonSlug
        schema:
          type: string
        description: Legacy salon slug — Flutter's single-l spelling.
        required: true
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPROVED
          - DRAFT
          - FLAGGED
          - REJECTED
          - SUBMITTED
          - incomplete
        description: '`incomplete` = DRAFT+SUBMITTED; otherwise one exact status.'
      - in: query
        name: to
        schema:
          type: string
        description: Window end, calendar day `YYYY-MM-DD` (inclusive).
      tags:
      - Compat
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompatReportListItem'
              examples:
                MergedReportList:
                  value:
                  - - id: 44
                      report_date: '2026-09-04'
                      mortality_count: 3
                      feed_kg: 125.5
                      water_l: 210.0
                      avg_weight_g: 1850.0
                      status: SUBMITTED
                      bird_count: 5000
                      avg_temperature_c: 24.5
                      avg_humidity_pct: 60.0
                      ventilation_status: STABLE
                      health_status: NORMAL
                      checklist:
                        feed: true
                        water: true
                        device: true
                      is_completed: false
                  summary: Merged report list
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/compat/v1/farms/{farmSlug}/salons/{salonSlug}/reports/{report_date}/:
    get:
      operationId: compat_report_by_date
      description: |-
        Delegates to the canonical single-by-date read: the merged single
        object, 404 when the day has no report, 400 on a malformed date or a
        multi-flock day, and the same `{"error": "not found"}` 404 for unknown or
        foreign slugs.
      summary: W2 — single report by calendar day (legacy slugs)
      parameters:
      - in: path
        name: farmSlug
        schema:
          type: string
        description: Legacy farm slug (legacy_slug_map).
        required: true
      - in: path
        name: report_date
        schema:
          type: string
        description: Calendar day in Asia/Tehran, `YYYY-MM-DD`.
        required: true
      - in: path
        name: salonSlug
        schema:
          type: string
        description: Legacy salon slug — Flutter's single-l spelling.
        required: true
      tags:
      - Compat
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatReportSingle'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/compat/v1/reports/:
    post:
      operationId: compat_report_create
      description: |-
        The reports-only compat-write exception. The body carries
        `farm_slug` + `salon_slug` **in addition to** the canonical/alias report
        fields; both slugs are required (400 when missing) and must agree — the
        salon must belong to the farm, a mismatch is a 404, never a 400 oracle.

        After resolution the request is handed to the canonical
        `POST /api/v1/saloons/{saloon_id}/reports/`, so Flutter aliases, the
        SUBMITTED-checklist gate, the FLAGGED auto medical ticket and
        `submitted_by = JWT user` all ride along untouched. There is no
        `reporter`/`reported_by` request key — client-sent values are ignored.
      summary: W3 — submit a report (legacy slugs)
      tags:
      - Compat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompatReportCreateRequest'
            examples:
              FlutterWrite:
                value:
                  farm_slug: morghdari-north
                  salon_slug: salon-a1
                  flock_id: 12
                  report_date: '2026-09-09'
                  casualties_today: 1
                  is_draft: true
                  checklist:
                    feed: true
                    water: true
                    device: true
                summary: Flutter write
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompatReportCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompatReportCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatReportSingle'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/compat/v1/reports/{report_id}/:
    patch:
      operationId: compat_report_edit
      description: |-
        Delegates to the canonical PATCH: aliases accepted, the Asia/Tehran
        same-day time-lock enforced (00:00 sharp, no grace), the checklist gate
        scoped to the merge surface, and the staff-exempt path still audited as
        `REPORT_ADMIN_EDIT`. Returns the merged single object.
      summary: W4 — edit a report (legacy route)
      parameters:
      - in: path
        name: report_id
        schema:
          type: integer
        description: Report id (caller's org).
        required: true
      tags:
      - Compat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompatReportEditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompatReportEditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompatReportEditRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompatReportSingle'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/v1/alerts/:
    get:
      operationId: list_org_alerts
      description: |-
        The missing org feed: every alert of the caller's org, newest first,
        with `{results, count}` pagination. `GET /saloons/{id}/alerts/` answers one
        saloon at a time; this answers "what is on fire right now" for the whole farm
        or the whole org.

        Filters: `farm_id`, `saloon_id`, `status` (`ACTIVE` default / `ALL`), `tier`
        (1-3 on `highest_tier_reached`), `metric` (metric key). Each is validated — an
        unknown tier or metric key is a 400, because a typo that silently narrows a
        feed reads exactly like "nothing is wrong".

        Scope rows narrow the result set like every other read surface (M2-06): a
        member with `account_role_scopes` rows sees only their saloons.
      summary: F9 — org-wide alert feed (engineer+)
      parameters:
      - in: query
        name: farm_id
        schema:
          type: integer
        description: Restrict to one farm.
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size (default 50, max 500).
      - in: query
        name: metric
        schema:
          type: string
        description: Metric key, e.g. temp, nh3, co2.
      - in: query
        name: offset
        schema:
          type: integer
        description: Page start (default 0).
      - in: query
        name: saloon_id
        schema:
          type: integer
        description: Restrict to one saloon.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ALL
        description: ACTIVE (default) skips resolved rows; ALL returns the history.
      - in: query
        name: tier
        schema:
          type: integer
        description: Exact highest escalation tier reached (1-3).
      tags:
      - Alerts & KPI
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertFeedResponse'
              examples:
                ActiveTier-2AmmoniaAlerts:
                  value:
                    results:
                    - alert_id: 6b1f0cbe-2f2f-4a3d-9d1a-6f0b7c1e5a11
                      metric_type: nh3
                      current_status: ACTIVE_TIER_2
                      current_value: 27.5
                      source: REALTIME
                      triggered_at: '2026-09-11T21:02:00Z'
                      resolved_at: null
                      highest_tier_reached: 2
                    count: 1
                  summary: Active Tier-2 ammonia alerts
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
  /api/v1/alerts/{alert_id}/acknowledge/:
    post:
      operationId: acknowledge_alert
      description: |-
        Writes the acknowledgement row and the Redis escalation-pause key
        in one transaction (M4-06 service). Allowed for `worker`/`engineer`/`manager`/
        `owner` — a bare reader cannot pause an escalation.

        Acknowledging pauses **escalation** for the configured window (default
        10 minutes, `system_configuration`); it does not resolve the alert or hide a
        Tier-1 velocity breach from the paging paths (Decision 10: NH3 and temp
        velocity always page).

        Cross-org ids are a 404 — nothing to acknowledge, never an oracle.
      summary: Acknowledge an alert
      parameters:
      - in: path
        name: alert_id
        schema:
          type: string
        description: Alert instance id (uuid).
        required: true
      tags:
      - Alerts & KPI
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeRequestRequest'
            examples:
              AcknowledgeWithNote:
                value:
                  notes: Checked ventilation, NH3 falling.
                summary: Acknowledge with note
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertAcknowledgeRequestRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertAcknowledgeResponse'
              examples:
                Acknowledged:
                  value:
                    alert_id: 3f7c9e2a-1b4d-4e6f-8a2c-5d7f9b3e6a1c
                    acknowledged_by: 42
                    pause_minutes: 10
                    status: ACKNOWLEDGED
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/v1/audit-logs/:
    get:
      operationId: list_audit_logs
      description: |-
        Newest-first `{results, count}` page of the org's activity log
        (`created_at` ← `AccountActivityLog.timestamp`). Row objects are contract
        shapes; `details` is the free-form action payload.

        Filters: `actor_id`, `action`, `farm_id`, `saloon_id`, `from`/`to` (ISO Z).
        A malformed scalar — including a non-numeric id or an unparseable timestamp
        — is a 400 `invalid pagination`, never a silent full-table answer.
      summary: O1 — org audit log (owner, manager)
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Exact action code, e.g. THRESHOLD_UPDATED.
      - in: query
        name: actor_id
        schema:
          type: integer
        description: Filter to one acting user.
      - in: query
        name: farm_id
        schema:
          type: integer
        description: Filter to one farm (int PK).
      - in: query
        name: from
        schema:
          type: string
        description: ISO Z timestamp window start (timestamp ≥).
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size (default 50, max 500).
      - in: query
        name: offset
        schema:
          type: integer
        description: Page start (default 0).
      - in: query
        name: saloon_id
        schema:
          type: integer
        description: Filter to one saloon (int PK).
      - in: query
        name: to
        schema:
          type: string
        description: ISO Z timestamp window end (timestamp ≤).
      tags:
      - Ops
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
              examples:
                AuditPage:
                  value:
                    results:
                    - id: '812'
                      actor_id: 42
                      username: engineer_a
                      action: THRESHOLD_UPDATED
                      details:
                        rule_id: 7
                        metric: temp
                        min_value: 20.0
                        max_value: 26.5
                      created_at: '2026-08-18T09:14:02Z'
                    count: 1
                  summary: Audit page
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
  /api/v1/auth/login/:
    post:
      operationId: login
      description: |-
        Exchanges credentials for the contract's token pair —
        `{access_token, refresh_token, user{…}}`, **not** SimpleJWT's stock
        `{access, refresh}` keys; the response shape is canon (Security §4.1b).

        Claims frozen at token birth: `org_id` = the caller's OLDEST active membership,
        `roles` = sorted union of the membership role and the account role scopes, and
        `sid` = this refresh token's `jti` (which is what makes O11 mark the line
        `current`). A tenant user with **zero** active memberships is a 401 and gets no
        token at all.

        Platform-staff logins (v1.7.1, §4.5) MUST carry a live `mfa_code` against a
        CONFIRMED enrollment: missing/invalid → **403** `mfa_required` (+ `enrolled`
        to say whether the caller should confirm or run `/auth/mfa/setup/` first).
        superuser break-glass accounts are deliberately NOT gated here — the support
        surface itself rejects them. Rotation is intentionally OFF (access 15 min,
        refresh 7 d).
      summary: Log in (tenant or platform staff)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
            examples:
              TenantLogin:
                value:
                  username: tom@goldenegg.com
                  password: farm-floor-2026
                summary: Tenant login
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                LoginResponse:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…
                    user:
                      id: 9
                      username: tom@goldenegg.com
                      roles:
                      - owner
                      - doctor
                      org_id: 1f0c3a54-6f2b-4c9d-9d5e-2b7f4a1c8e30
                      org_name: Golden Egg
                      is_platform_staff: false
                  summary: Login response
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid credentials, or a tenant user with zero active memberships.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaRequired'
          description: Platform staff without a verified TOTP code.
  /api/v1/auth/mfa/confirm/:
    post:
      operationId: confirm_staff_mfa
      description: |-
        Verifies the first live code and flips the enrollment row to confirmed,
        which is what unblocks platform-staff login. A missing or wrong code is a
        plain 400 and stays retryable — the surface is not rate-limited into lockout
        by a single typo, but the login path still requires a live code every time.
      summary: Confirm the staff TOTP enrollment
      tags:
      - Platform Support
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaConfirmRequestRequest'
            examples:
              ConfirmEnrollment:
                value:
                  code: '492013'
                summary: Confirm enrollment
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MfaConfirmRequestRequest'
        required: true
      security:
      - BearerAuth: []

  /api/v1/threshold-templates/{template_id}/publish/:
    post:
      operationId: publish_threshold_template
      description: |-
        Makes a draft LIVE: from this moment `effective_template` may resolve it,
        so the affected saloons are re-cached in the same request (the publish fires
        the alerts cache sweep — the same fast path a rule edit takes).

        Optional `is_default: true` also promotes it to the org's default in one call,
        demoting the incumbent. Publishing a template whose breed already has a
        published org template, or promoting to default while another published
        default exists, is a 409 — the uniqueness guards are DB constraints, not
        gentlemen's agreements.

        404 for a foreign or org-NULL (built-in) template — the shared catalog is
        writable by NO ONE, exactly like O3. 409 for an already-published template.
        Writes a `THRESHOLD_TEMPLATE_PUBLISHED` audit row in the same transaction.
      summary: O15 — publish a template draft (owner, manager)
      parameters:
      - in: path
        name: template_id
        schema:
          type: integer
        description: Draft template id.
        required: true
      tags:
      - Ops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdTemplatePublishRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ThresholdTemplatePublishRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThresholdTemplatePublishRequestRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdTemplateDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
        '409':
          description: Already published, or the breed/default slot is taken.
  /api/v1/thresholds/:
    get:
      operationId: list_thresholds
      description: |-
        `{results, count}` page of the caller's org template rules **plus** the
        global built-in catalog (`template.org IS NULL`); a foreign org's template
        rules are invisible here and 404 on O3.

        The rule's `min`/`max` are the contract keys; `day_from`/`day_to` bound the
        flock-age window. Filter by `metric_key`; `saloon_id` narrows to the rules of
        the templates matching that saloon's ACTIVE flock breed — a saloon with no
        active flock is an **empty 200** `{"results": [], "count": 0}`.
      summary: O2 — threshold rules (engineer+)
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size (default 50, max 500).
      - in: query
        name: metric_key
        schema:
          type: string
        description: 'Filter to one metric (source column: metric).'
      - in: query
        name: offset
        schema:
          type: integer
        description: Page start (default 0).
      - in: query
        name: saloon_id
        schema:
          type: integer
        description: Narrow to the templates matching that saloon's active flock breed.
      tags:
      - Ops
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
  /api/v1/thresholds/{rule_id}/:
    put:
      operationId: update_threshold
      description: |-
        Partial PUT: send `min` and/or `max` (column-name aliases
        `min_value`/`max_value` are accepted too). Rules are **template**-scoped, and
        only the caller's OWN-org templates are writable — global built-in rules stay
        readable via O2 but always 404 here (a shared catalog row must never be
        editable across tenants).

        Bounds are metric-keyed (`THRESHOLD_BOUNDS`), the `min < max` rule always
        applies, and an out-of-bounds or non-numeric value is a 400. Every accepted
        edit writes a `THRESHOLD_UPDATED` audit row (visible in O1) in the same
        transaction as the update. Returns the updated rule item.
      summary: O3 — edit a threshold rule (manager+)
      parameters:
      - in: path
        name: rule_id
        schema:
          type: integer
        description: Threshold rule id.
        required: true
      tags:
      - Ops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThresholdUpdateRequestRequest'
            examples:
              TightenTheTempBand:
                value:
                  min: 20.0
                  max: 26.5
                summary: Tighten the temp band
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ThresholdUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThresholdUpdateRequestRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdItem'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Forbidden — valid token but the role claim lacks this surface.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found — id/slug unknown OR outside the caller's org (never
            distinguished).
  /api/v1/metrics/:
    get:
      operationId: api_v1_metrics_retrieve
      tags:
      - Monitoring
      summary: Prometheus scrape endpoint (Observability Runbook §3.1)
      description: Prometheus exposition format (text/plain). Scraped by the monitoring
        stack directly on the internal network (daphne:8000); nginx returns 404 for
        it publicly. Worker-side counters/latencies are bridged via Redis and refreshed
        at scrape time.
      security: []
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain:
              schema:
                type: string

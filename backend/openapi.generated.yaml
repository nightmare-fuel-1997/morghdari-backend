          description: Forbidden — valid token but the role claim lacks this surface.
  /api/v1/auth/password/change/:
    post:
      operationId: change_password
      description: |-
        Requires the current password (`401 wrong current password` when it does
        not match). The new password must differ from the current one, be ≥10 chars,
        stay off the common-password denylist, and pass Django's configured validators
        — each failure is a 400 with a specific message, never a generic rejection.

        Success rotates the session register: every active refresh line is revoked
        (the next refresh is refused) while the current access token lives out its
        15 minutes. Throttled on the strict lane — 3/min per user.
      summary: O10 — change my password
      tags:
      - Ops
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
            examples:
              ChangePassword:
                value:
                  current_password: old-secret-1
                  new_password: farm-floor-2026
                summary: Change password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation error — malformed input, bad enum, or out-of-range
            value.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limited — strict lane (auth_strict 3/min) exceeded. Retry
            after 60s.
  /api/v1/auth/sessions/:
    get:
      operationId: list_my_sessions
      description: |-
        Bare list (no envelope) of the caller's non-revoked refresh lines,
        newest-seen first. `current: true` marks the presenting session (the claim's
        `sid` matches the row's `refresh_jti`).

        Scope is always the caller: there is no parameter to read someone else's
        sessions, and a revoked row disappears from this list.
      summary: O11 — my live sessions
      tags:
      - Ops
      security:
      - BearerAuth: []
      - BearerAuth: []

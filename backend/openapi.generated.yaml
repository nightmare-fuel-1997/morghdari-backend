      operationId: setup_staff_mfa
      description: |-
        Staff-not-superuser only. Issues an **unconfirmed** TOTP enrollment and
        returns the secret plus the `otpauth://` URI for the authenticator app.

        Until `/auth/mfa/confirm/` verifies a live code, platform-staff login stays
        blocked (`mfa_required`) — enroll-then-login is the intended first-run flow.
        Calling setup again re-issues the secret; a previously confirmed enrollment is
        not silently trusted.
      summary: (Re)issue the staff TOTP enrollment
      tags:
      - Platform Support
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
              examples:
                FreshTOTPEnrollment:
                  value:
                    secret: JBSWY3DPEHPK3PXP
                    otpauth_uri: otpauth://totp/Morghdari:support%40morghdari.com?secret=JBSWY3DPEHPK3PXP&issuer=Morghdari
                    confirmed: false
                  summary: Fresh TOTP enrollment
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthenticated — missing, expired, or malformed Bearer token.
        '403':

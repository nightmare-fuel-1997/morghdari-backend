      - rules
      - status
      - template_id
    ThresholdTemplateItem:
      type: object
      description: |-
        O4 row — lifecycle_templates catalog (v1.7.1 adds the write-surface
        columns; `status` is what tells a draft from a live template).
      properties:
        template_id:
          type: integer
        org_id:
          type: integer
          nullable: true
        breed_type:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        is_default:
          type: boolean
        status:
          type: string
          description: DRAFT | PUBLISHED (only PUBLISHED arms alarms).
        farm_id:
          type: integer
          nullable: true
          description: Owning farm of a draft (null = org-wide).
        created_by:
          type: integer
          nullable: true
        published_at:
          type: string
          nullable: true
      required:
      - status
      - template_id
    ThresholdTemplateListResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdTemplateItem'
      required:
      - count
      - results
    ThresholdTemplatePublishRequestRequest:
      type: object
      description: |-
        O15 optional body — `is_default` promotes the template to the org's
        default in the same call (409 when another published default exists).
      properties:
        is_default:
          type: boolean
    ThresholdTemplateUpdateRequestRequest:
      type: object
      description: |-
        O14 partial PUT body — `rules`, when present, REPLACES the whole band
        list (the set is the unit of meaning: bands are validated for overlap).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        breed_type:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdRuleInputRequest'
    ThresholdUpdateRequestRequest:
      type: object
      description: O3 PUT body — contract {min, max} keys (partial PUT allowed).
      properties:
        min:
          type: number
          format: double
          nullable: true
          description: New min_value (alias of min_value).
        max:
          type: number
          format: double
          nullable: true
          description: New max_value (alias of max_value).
    UserProfile:
      type: object
      description: The `user` envelope — reuses the claim rule, so it cannot disagree
        with the token.
      properties:
        id:
          type: integer
        username:
          type: string
        roles:
          type: array
          items:
            enum:
            - owner
            - manager
            - engineer
            - doctor
            - worker
            - installer
            - reviewer
            type: string
            description: |-
              * `owner` - owner
              * `manager` - manager
              * `engineer` - engineer
              * `doctor` - doctor
              * `worker` - worker
              * `installer` - installer
              * `reviewer` - reviewer
            x-spec-enum-id: dda30d0d1de7d8a9
          description: Sorted union of the membership role and the account role scopes.
        org_id:
          type: string
          nullable: true
          description: Null for platform staff — staff tokens are org-less by design
            (D15).
        org_name:
          type: string
          nullable: true
        is_platform_staff:
          type: boolean
      required:
      - id
      - is_platform_staff
      - roles
      - username
    VetReviewRequestRequest:
      type: object
      description: POST /reports/{report_id}/vet-review/ body — the review decision.
      properties:
        decision:
          enum:
          - APPROVED
          - REJECTED
          type: string
          description: |-
            * `APPROVED` - APPROVED
            * `REJECTED` - REJECTED
          x-spec-enum-id: 00a806fd4640c2d2
        review_note:
          type: string
          nullable: true
      required:
      - decision
    WaterIntakeEntry:
      type: object
      properties:
        entry_date:
          type: string
          format: date
        source:
          enum:
          - manual
          - device
          type: string
          description: |-
            * `manual` - manual
            * `device` - device
          x-spec-enum-id: f7b500e8953b0c6d
        water_l:
          type: number
          format: double
          description: Litres consumed that day.
      required:
      - entry_date
      - source
      - water_l
    WaterIntakeUpsertRequestRequest:
      type: object
      properties:
        entry_date:
          type: string
          format: date
        water_l:
          type: number
          format: double
        notes:
          type: string
      required:
      - entry_date
      - water_l
    WaterIntakeUpsertResponse:
      type: object
      properties:
        entry_date:
          type: string
          format: date
        water_l:
          type: number
          format: double
        source:
          enum:
          - manual
          - device
          type: string
          description: |-
            * `manual` - manual
            * `device` - device
          x-spec-enum-id: f7b500e8953b0c6d
        corrected:
          type: boolean
          description: True when the date already had a row (UPDATE, audited).
      required:
      - corrected
      - entry_date
      - source
      - water_l
    WeightSample:
      type: object
      description: GET item / POST 201 body — mirrors kpi_views._sample_out.
      properties:
        sampled_at:
          type: string
          format: date-time
          description: Sampling moment (naive input is read as Asia/Tehran).
        sample_size:
          type: integer
          minimum: 1
          description: Birds weighed in this sampling event.
        avg_weight_g:
          type: number
          format: double
          description: Mean weight in grams.
        uniformity_pct:
          type: number
          format: double
          nullable: true
          description: '% of birds within ±10% of the mean; null when not recorded.'
        source:
          enum:
          - manual
          - device
          type: string
          x-spec-enum-id: f7b500e8953b0c6d
          description: |-
            'manual' in v1; 'device' reserved for weigh stations.

            * `manual` - manual
            * `device` - device
      required:
      - avg_weight_g
      - sample_size
      - sampled_at
      - source
    WeightSampleCreateRequest:
      type: object
      properties:
        sample_size:
          type: integer
          minimum: 1
        avg_weight_g:
          type: number
          format: double
        min_weight_g:
          type: number
          format: double
        max_weight_g:
          type: number
          format: double
        uniformity_pct:
          type: number
          format: double
        sampled_at:
          type: string
          format: date-time
          description: Defaults to now when omitted.
        notes:
          type: string
      required:
      - avg_weight_g
      - sample_size
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    GatewayBasicAuth:
      type: http
      scheme: basic
      description: Gateway device authentication for the zero-touch config endpoint.
        Username = gateway_slot_id, password = the current MQTT credential.
servers:
- url: /
  description: This server — requests resolve against the host serving these docs
tags:
- name: Authentication
  description: Login, token refresh, MFA, sessions.
- name: Org Management
  description: Owner-exclusive member invite/deactivate.
- name: Farms & Saloons
  description: Farm list, saloon detail, operational-state loop, flock cycles.
- name: Telemetry
  description: Saloon/farm sensor reads, hourly analytics, metric catalog.
- name: Provisioning & Gateways
  description: Geography drill-down, gateway requests/review, lifecycle, config, rotation.
- name: Alerts & KPI
  description: Saloon alerts + ack, weight/feed/water intake, biosecurity, capabilities,
    KPIs, dashboard config.
- name: Monitoring
  description: Public health + hardware-time probes.
- name: Ops
  description: Audit logs, thresholds, photos, gateway reads, password change, sessions.
- name: Reports
  description: Daily saloon reports (DRAFT→SUBMITTED→APPROVED/REJECTED + FLAGGED),
    vet review.
- name: Platform Support
  description: Staff-scoped support session + whitelisted ops (audited).
- name: Compat
  description: Flutter compat aliases under /api/compat/v1 (W1–W5 report routes).

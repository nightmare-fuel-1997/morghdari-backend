# Morghdari nginx — canonical production config (Audit AU-fix 2026-08-16).
# Mounted read-only at /etc/nginx/nginx.conf by docker-compose.prod.yml (nginx service).
# Byte-identical port of the docs-repo nginx/nginx.conf (Deployment Guide §2.1).

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;
    server_tokens off;

    # Log $uri, NOT $request — WebSocket connect URLs carry ?token=<JWT> and
    # query strings must NEVER hit the logs.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log  /var/log/nginx/access.log main;

    # WebSocket Upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate-limit zones
    limit_req_zone $binary_remote_addr zone=api:10m            rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_upgrade:10m     rate=5r/s;
    limit_req_zone $binary_remote_addr zone=gateway_config:10m rate=1r/s;  # device endpoint
    limit_req_status 429;

    upstream daphne_cluster {
        least_conn;
        server daphne:8000;
    }

    client_max_body_size 10m;

    # Docker embedded DNS — needed for OCSP stapling resolution
    resolver 127.0.0.11 valid=300s ipv6=off;

    # ------------------------------------------------------------------
    # HTTP: ACME webroot + container healthcheck + redirect to HTTPS
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok";
        }

        # certbot webroot (mount /var/www/certbot when using webroot mode)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # HTTPS
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        # Template domain — override per deployment. Live on VPS 82.115.17.252
        # (2026-09-17): farmplus.romaksystem.com + mqtt.farmplus.romaksystem.com
        # (mqtt.* serves no HTTP; listed so SNI intent stays explicit).
        server_name api.morghdari.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.3;
        # TLS 1.3 suites are set via ssl_conf_command (ssl_ciphers only
        # governs TLS 1.2, which is disabled here).
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/nginx/certs/chain.pem;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Prometheus scrape endpoint — internal-network only (the monitoring
        # stack scrapes daphne directly); nginx 404s it publicly (M7-04).
        location = /api/v1/metrics/ {
            return 404;
        }

        # Django REST API (human/operator clients)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://daphne_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway config fetch — device-facing endpoint, brute-force guard
        location /api/v1/gateways/ {
            limit_req zone=gateway_config burst=5 nodelay;
            proxy_pass http://daphne_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django admin (system_configuration panel — Decision 21).
        # R3-fix 2026-08-16: /admin/ was previously unreachable (no matching
        # location) — must proxy to daphne like /api/.
        # /admin/ static files (admin/css, admin/js) are collected by Django
        # into static_volume and served by the /static/ location below
        # (whitenoise/collectstatic) — no special handling needed here.
        location /admin/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://daphne_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket (ASGI)
        location /ws/ {
            proxy_pass http://daphne_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            limit_req zone=ws_upgrade burst=10 nodelay;
        }

        # Static files (static_volume mounted at /static)
        location /static/ {
            alias /static/;
            access_log off;
            expires 7d;
        }
    }
}

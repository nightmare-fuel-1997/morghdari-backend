# =============================================================================
# CI Compose — ephemeral TimescaleDB + Redis + pytest + real EMQX. The
# acceptance gate.
# ONE-COMMAND RITUAL (preferred): bash scripts/run_acceptance.sh
#   → migrate-gate + test + image-scan with C-13-safe -p and --build enforced.
# Manual single gates (always with -p morghdari_ci AND --build):
#   docker compose -f docker-compose.ci.yml -p morghdari_ci run --rm --build test
#   docker compose -f docker-compose.ci.yml -p morghdari_ci run --rm --build migrate-gate
#   docker compose -f docker-compose.ci.yml -p morghdari_ci run --rm image-scan
#   docker compose -f docker-compose.ci.yml -p morghdari_ci run --rm --build live-verify
#
# فارسی: سرویس‌های یک‌بارمصرف برای CI؛ گیتِ پذیرش M0/M1 همین‌جاست — سبز یعنی قبول.
#
# Provenance & deliberate adaptations from backend_docs/docker-compose.ci.yml:
# - ADDED build.target: test — the docs template predates our 3-stage
#   Dockerfile (§8); without `target` compose would build AND ship the final
#   `runtime` stage, whose whole point is that pytest physically cannot exist
#   in it. CI must run the `test` stage, nothing else.
# - CHANGED DATABASE_URL user morghdari_app -> morghdari_test (bootstrap
#   superuser provisioned by POSTGRES_* below): initdb-created roles carry no
#   passwords, so a TCP login as morghdari_app cannot authenticate in CI. This
#   matches the docs' own comment — RLS/app-role behavior is exercised by a
#   pytest session fixture via SET ROLE + GUC (tests/test_rls.py, M1-09),
#   never by the bootstrap roles. Runtime app-role URLs are a deployment
#   concern (Deployment & DevOps Guide §2.1), not a CI concern.
# - image pins mirror CONSTRAINTS C-04: exact tags only (timescaledb 2.29.2-pg16).
#
# `version:` key kept despite the compose v2 obsolete warning — CONSTRAINTS C-04
# family decision: these files stay line-compatible with the docs repo copies.
# =============================================================================

version: "3.8"

volumes:
  morghdari_trivy_cache:

services:
  postgres:
    image: timescale/timescaledb:2.29.2-pg16
    # Bootstrap SUPERUSER 'morghdari_test' provisions the CI database. RLS
    # policies are exercised via a pytest session fixture (SET ROLE / GUC),
    # not via the bootstrap roles — the superuser is fine for CI only.
    environment:
      POSTGRES_DB: morghdari_test
      POSTGRES_USER: morghdari_test
      POSTGRES_PASSWORD: ci_password_only
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morghdari_test -d morghdari_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # Skill MUST-DO (health checks everywhere a service can be): the pytest
    # and migrate-gate jobs genuinely use Redis (cache, ws:active), so a
    # not-ready broker must hold them back like postgres does.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Real EMQX for the `live-verify` job — M5-07 authn/authz/revoke and M5-08
  # rotation are broker semantics that mocked tests cannot prove. Same broker
  # profile as docker-compose.dev.yml / start_dev_stack.sh run_emqx:
  # built-in-DB authn, deny-by-default authorization, management-API key
  # bootstrap (EMQX 5.5 /api/v5 requires API keys; emqx_provision.py and the
  # live verifier need it). NO data volume: each run gets a FRESH broker, so
  # the verify's revoke-to-empty and rotation assertions start from zero.
  # C-05: EMQX 5.5 requires mechanism alongside backend.
  emqx:
    image: emqx:5.5
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "dev_password"
      EMQX_DASHBOARD__LISTENERS__HTTP__AUTH_TYPE: "basic"
      EMQX_AUTHENTICATION__1__MECHANISM: "password_based"
      EMQX_AUTHENTICATION__1__BACKEND: "built_in_database"
      EMQX_AUTHORIZATION__NO_MATCH: "deny"
      EMQX_API_KEY__BOOTSTRAP_FILE: "/opt/emqx/etc/api_keys"
    volumes:
      - ./scripts/emqx-api-keys.txt:/opt/emqx/etc/api_keys:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Real-broker acceptance job: seeds the broker exactly like the dev stack
  # (emqx_provision.py — bcrypt authn chain, per-farm sim users + subscriber,
  # built-in-DB authz source, no_match=deny) then runs scripts/live_verify_emqx.py
  # (10 checks over real MQTT + the management API). Non-zero exit fails CI.
  # The repo-root scripts/ dir is mounted read-only — the test image packages
  # only ./backend; the farm manifest is generated on the fly (CI has no DB).
  live-verify:
    build:
      context: ./backend
      target: test
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      EMQX_API_URL: http://emqx:18083
      EMQX_API_USER: demo-admin
      EMQX_API_PASS: dev_password
      EMQX_MQTT_HOST: emqx
      EMQX_MQTT_PORT: "1883"
    volumes:
      - ./scripts:/scripts:ro
    command:
      - sh
      - -c
      - |
        set -e
        python -c "import json; json.dump({'farms': [{'id': 1}]}, open('/tmp/farm_manifest.json', 'w'))"
        python /scripts/emqx_provision.py --manifest /tmp/farm_manifest.json --base-url http://emqx:18083
        python /scripts/live_verify_emqx.py

  test:
    build:
      context: ./backend
      target: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Single-env convention (Blueprint §2) — same dialect as prod compose.
      DATABASE_URL: postgres://morghdari_test:ci_password_only@postgres:5432/morghdari_test
      REDIS_URL: redis://redis:6379
      DJANGO_SETTINGS_MODULE: config.settings.test
      MORGHDARI_INITDB_DIR: /initdb
    # Explicit image name (not the project-derived default) so the scanner
    # service can reference exactly what the test stage built, regardless of
    # the compose -p project name.
    image: morghdari-test:ci
    # The image packages ONLY ./backend (§8 build context); repo-root
    # machinery is mounted read-only instead of duplicated into the image:
    # initdb for the bootstrap SQL, monitoring/ for the MET-AVAIL config
    # assertions (test_m7_08 reads prometheus.yml + alerts.yml at REPO_ROOT —
    # inside the image that is / and would otherwise miss the tree entirely).
    volumes:
      - ./initdb:/initdb:ro
      - ./monitoring:/monitoring:ro
    # Coverage gates live in the command (mirrors docs template); pytest.ini
    # addopts would double-count --cov args otherwise kept minimal here.
    # The module gate runs in the SAME container right after pytest so it reads
    # the full PG-suite coverage.json: views/api <80 FAILS the build, service
    # files <90 only WARN (backfill queue — scripts/check_module_coverage.py).
    # Explicit sh -c form like live-verify: a plain string command gets NO
    # shell from compose, so `&&` would arrive at pytest as literal argv.
    command:
      - sh
      - -c
      - |
        set -e
        pytest --cov=apps --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80
        python scripts/check_module_coverage.py

  # Migration deployability gate — the --nomigrations hole closer. Runs BEFORE
  # pytest conceptually (a migration graph that cannot deploy makes test
  # results moot); compose order is irrelevant since the throwaway DB is its
  # own universe. Uses the same test-stage image (psycopg ships in it).
  migrate-gate:
    build:
      context: ./backend
      target: test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Admin URL = the bootstrap superuser (CREATE/DROP DATABASE rights);
      # POSTGRES_DB points the maintenance connection at the existing
      # bootstrap DB; the script swaps in the throwaway name itself.
      DATABASE_URL: postgres://morghdari_test:ci_password_only@postgres:5432/morghdari_test
      POSTGRES_DB: morghdari_test
    command: python scripts/migrate_gate.py

  # Container scanning (skill MUST-DO): CRITICAL/HIGH CVEs fail the ritual.
  # --ignore-unfixed keeps the gate about FIXABLE vulnerabilities — a base
  # image with no vendor fix yet is a tracked fact, not a merge blocker.
  # Scans the exact image the test service builds (morghdari-test:ci); the
  # docker socket is how trivy reaches the daemon's local images.
  image-scan:
    image: aquasec/trivy:0.55.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent vuln-DB cache: without it every --rm run re-downloads the
      # 111 MB DB (and one flaky EOF aborts the whole gate). One download,
      # reused by every later run.
      - morghdari_trivy_cache:/root/.cache/trivy
    command:
      - image
      - --exit-code
      - "1"
      - --severity
      - CRITICAL,HIGH
      - --ignore-unfixed
      - morghdari-test:ci
